<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OBS Widget Studio</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // Note: For this specific request, the user provided a Supabase URL and Key.
        // I will use the official Supabase JS client instead of Firebase to meet their exact requirements.
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a; /* Slate 900 */
            color: #f8fafc; /* Slate 50 */
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input styling */
        input[type="text"], input[type="number"], select, input[type="password"], input[type="email"] {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #3b82f6;
        }

        /* =========================================
           WIDGET RENDERER STYLES (For OBS View)
           ========================================= */
        #obs-view {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: none; /* Hidden by default, shown if URL has ?widgetId=... */
            position: absolute;
            top: 0; left: 0;
        }

        /* Marquee Styles */
        .marquee-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            align-items: center;
            height: 100%;
        }
        
        .marquee-content {
            display: inline-block;
            padding-left: 100%; /* Start offscreen right */
            will-change: transform;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        /* Marquee Effects */
        .effect-glow { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
        .effect-shadow { text-shadow: 2px 2px 4px rgba(0,0,0,0.8); }
        .effect-outline { -webkit-text-stroke: 1px black; }

        /* Slideshow Styles */
        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
        }
        .slideshow-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-size: contain;
            background-position: center;
            background-repeat: no-repeat;
            opacity: 0;
            transition: opacity 1s ease-in-out;
        }
        .slideshow-slide.active { opacity: 1; }
        
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        /* Prevent OBS background */
        body.is-obs-mode {
            background-color: transparent !important;
        }
    </style>
</head>
<body>

    <!-- This section is only visible when the URL contains ?widgetId=... -->
    <div id="obs-view">
        <div id="widget-renderer" class="w-full h-full"></div>
    </div>

    <div id="app-container" class="min-h-screen flex flex-col hidden">
        <!-- Navigation -->
        <nav class="glass-panel p-4 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fas fa-layer-group text-blue-500 text-2xl"></i>
                    <h1 class="text-xl font-bold">OBS Widget Studio</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm text-slate-300"></span>
                    <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm transition hidden">
                        <i class="fas fa-sign-out-alt mr-2"></i>Выйти
                    </button>
                </div>
            </div>
        </nav>

        <!-- Main Content -->
        <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full flex flex-col md:flex-row gap-6">
            
            <!-- Left Sidebar (Widget List) -->
            <div class="w-full md:w-1/3 flex flex-col gap-4">
                <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                    <h2 class="text-lg font-semibold">Мои Виджеты</h2>
                    <button onclick="showCreateModal()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg transition shadow-lg shadow-blue-500/30">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <div id="widgets-list" class="flex flex-col gap-3 overflow-y-auto" style="max-height: calc(100vh - 200px);">
                    <!-- Widgets will be injected here -->
                    <div class="text-center text-slate-500 py-8">Загрузка...</div>
                </div>
            </div>

            <!-- Right Panel (Widget Editor) -->
            <div class="w-full md:w-2/3 glass-panel rounded-xl p-6 hidden flex-col" id="editor-panel">
                <div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-4">
                    <div>
                        <h2 id="editor-title" class="text-2xl font-bold text-white">Редактор</h2>
                        <p class="text-slate-400 text-sm mt-1">Настройте внешний вид вашего виджета</p>
                    </div>
                    <div class="flex gap-2">
                         <button onclick="copyObsUrl()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <i class="fas fa-link"></i> Ссылка для OBS
                        </button>
                        <button onclick="saveWidget()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                    </div>
                </div>

                <!-- Live Preview Area -->
                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Предпросмотр</h3>
                    <div class="bg-slate-900 border border-slate-700 rounded-lg h-48 relative overflow-hidden flex items-center justify-center checkerboard-bg">
                        <!-- Checkerboard CSS -->
                        <style>
                            .checkerboard-bg {
                                background-image: 
                                    linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                                    linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                                    linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                                    linear-gradient(-45deg, transparent 75%, #1e293b 75%);
                                background-size: 20px 20px;
                                background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
                            }
                        </style>
                        <div id="preview-container" class="w-full h-full relative"></div>
                    </div>
                </div>

                <!-- Dynamic Settings Form -->
                <div id="settings-form" class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <!-- Settings injected via JS based on widget type -->
                </div>

                <!-- Delete Area -->
                <div class="mt-auto pt-8 flex justify-end">
                    <button onclick="deleteCurrentWidget()" class="text-red-400 hover:text-red-300 text-sm transition">
                        <i class="fas fa-trash-alt mr-1"></i> Удалить виджет
                    </button>
                </div>
            </div>
            
            <!-- Empty State -->
            <div id="empty-state" class="w-full md:w-2/3 glass-panel rounded-xl p-8 flex flex-col items-center justify-center text-center">
                <i class="fas fa-magic text-6xl text-slate-600 mb-4"></i>
                <h3 class="text-xl font-bold text-white mb-2">Выберите или создайте виджет</h3>
                <p class="text-slate-400 max-w-md">Создавайте красивые бегущие строки или слайдшоу для ваших трансляций.</p>
            </div>

        </main>
    </div>

    
    <!-- Auth Modal -->
    <div id="auth-modal" class="modal bg-slate-900">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <i class="fas fa-video text-blue-500 text-4xl mb-3"></i>
                <h2 class="text-2xl font-bold">Вход в систему</h2>
                <p class="text-slate-400 text-sm">Войдите, чтобы сохранять виджеты</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Email</label>
                    <input type="email" id="auth-email" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Пароль</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>
                <div id="auth-error" class="text-red-400 text-sm hidden text-center"></div>
                
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-semibold transition mt-4">
                    Войти
                </button>
                <button onclick="handleSignup()" class="w-full bg-transparent border border-blue-600 text-blue-400 hover:bg-blue-600/10 py-3 rounded-lg font-semibold transition mt-2">
                    Регистрация
                </button>
            </div>
        </div>
    </div>

    <!-- Create Widget Modal -->
    <div id="create-modal" class="modal">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Новый виджет</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Название</label>
                    <input type="text" id="new-widget-name" placeholder="Например: Донаты" maxlength="30">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Тип виджета</label>
                    <select id="new-widget-type">
                        <option value="marquee">Бегущая строка (Текст)</option>
                        <option value="slideshow">Слайдшоу (Изображения)</option>
                    </select>
                </div>
                <div class="flex gap-2 mt-6">
                    <button onclick="closeModal('create-modal')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded transition">Отмена</button>
                    <button onclick="createWidget()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded transition font-semibold">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Message Box Modal (Custom Alert) -->
    <div id="msg-modal" class="modal z-[100]">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm text-center">
            <i id="msg-icon" class="fas fa-info-circle text-3xl mb-3 text-blue-500"></i>
            <h3 id="msg-title" class="text-lg font-bold mb-2">Message</h3>
            <p id="msg-text" class="text-slate-300 mb-6 text-sm"></p>
            <button onclick="closeModal('msg-modal')" class="bg-blue-600 hover:bg-blue-500 py-2 px-6 rounded transition">OK</button>
        </div>
    </div>

    <script>
        // --- 1. CONFIGURATION & INIT ---
        const SUPABASE_URL = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        const SUPABASE_KEY = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx';
        const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        // State
        let currentUser = null;
        let widgets = [];
        let currentWidget = null;
        let previewInterval = null;

        // Default Configs
        const DEFAULT_CONFIGS = {
            marquee: {
                text: 'Добро пожаловать на стрим! Спасибо за просмотр.',
                speed: 10,
                color: '#ffffff',
                fontFamily: 'Inter',
                fontSize: 48,
                direction: 'left',
                effect: 'none',
                fontWeight: '700'
            },
            slideshow: {
                delay: 5, // seconds
                transition: 'fade',
                images: [] // Array of URLs
            }
        };

        // --- 2. BOOTSTRAP & ROUTING ---
        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const obsWidgetId = urlParams.get('widgetId');

            if (obsWidgetId) {
                // OBS Mode
                document.body.classList.add('is-obs-mode');
                document.getElementById('obs-view').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
                loadWidgetForOBS(obsWidgetId);
            } else {
                // Studio Mode
                document.getElementById('obs-view').style.display = 'none';
                document.getElementById('app-container').classList.remove('hidden');
                checkAuth();
            }
        });

        // --- 3. AUTHENTICATION ---
        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            handleAuthChange(session);

            supabase.auth.onAuthStateChange((_event, session) => {
                handleAuthChange(session);
            });
        }

        function handleAuthChange(session) {
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-modal').classList.remove('active');
                document.getElementById('user-display').textContent = currentUser.email;
                document.getElementById('btn-logout').classList.remove('hidden');
                loadWidgets();
            } else {
                currentUser = null;
                document.getElementById('auth-modal').classList.add('active');
                document.getElementById('btn-logout').classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            
            errDiv.classList.add('hidden');
            if(!email || !password) return showError("Введите email и пароль");

            const { data, error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) showError(error.message);
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            const errDiv = document.getElementById('auth-error');
            
            errDiv.classList.add('hidden');
            if(!email || !password) return showError("Введите email и пароль");

            const { data, error } = await supabase.auth.signUp({ email, password });
            if (error) {
                showError(error.message);
            } else {
                showMessage("Успех", "Регистрация успешна. Проверьте почту для подтверждения или войдите.");
            }
        }

        document.getElementById('btn-logout').addEventListener('click', async () => {
            await supabase.auth.signOut();
            window.location.reload();
        });

        function showError(msg) {
            const errDiv = document.getElementById('auth-error');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        // --- 4. WIDGET MANAGEMENT (CRUD) ---
        async function loadWidgets() {
            const listEl = document.getElementById('widgets-list');
            listEl.innerHTML = '<div class="text-center text-slate-500 py-4">Загрузка...</div>';

            const { data, error } = await supabase
                .from('p_widgets.widgets')
                .select('*')
                .order('created_at', { ascending: false });

            if (error) {
                console.error(error);
                listEl.innerHTML = '<div class="text-red-400 text-sm p-4">Ошибка загрузки виджетов</div>';
                return;
            }

            widgets = data || [];
            renderWidgetList();
        }

        function renderWidgetList() {
            const listEl = document.getElementById('widgets-list');
            listEl.innerHTML = '';

            if (widgets.length === 0) {
                listEl.innerHTML = '<div class="text-center text-slate-500 py-8 text-sm">Нет виджетов. Создайте первый!</div>';
                return;
            }

            widgets.forEach(w => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg border cursor-pointer transition flex items-center gap-3 ${
                    currentWidget?.id === w.id ? 'bg-blue-600/20 border-blue-500' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'
                }`;
                div.onclick = () => selectWidget(w);

                const icon = w.widget_type === 'marquee' ? 'fa-font' : 'fa-images';
                const typeText = w.widget_type === 'marquee' ? 'Текст' : 'Слайдшоу';

                div.innerHTML = `
                    <div class="bg-slate-900 w-10 h-10 rounded flex items-center justify-center text-blue-400">
                        <i class="fas ${icon}"></i>
                    </div>
                    <div>
                        <div class="font-semibold text-white">${w.name}</div>
                        <div class="text-xs text-slate-400">${typeText}</div>
                    </div>
                `;
                listEl.appendChild(div);
            });
        }

        function showCreateModal() {
            document.getElementById('new-widget-name').value = '';
            document.getElementById('create-modal').classList.add('active');
        }

        async function createWidget() {
            const name = document.getElementById('new-widget-name').value.trim();
            const type = document.getElementById('new-widget-type').value;

            if (!name) return alertCustom("Ошибка", "Введите название виджета");

            const newWidget = {
                user_id: currentUser.id,
                name: name,
                widget_type: type,
                config: DEFAULT_CONFIGS[type]
            };

            const { data, error } = await supabase
                .from('p_widgets.widgets')
                .insert([newWidget])
                .select();

            if (error) {
                console.error(error);
                alertCustom("Ошибка", "Не удалось создать виджет");
            } else {
                closeModal('create-modal');
                await loadWidgets();
                if (data && data.length > 0) selectWidget(data[0]);
            }
        }

        function selectWidget(widget) {
            currentWidget = widget;
            renderWidgetList(); // Update active state
            
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('editor-panel').classList.remove('hidden');
            document.getElementById('editor-panel').classList.add('flex');
            
            document.getElementById('editor-title').textContent = widget.name;
            
            buildSettingsForm();
            updatePreview();
        }

        async function saveWidget() {
            if (!currentWidget) return;

            // Collect data from form
            const newConfig = { ...currentWidget.config };
            
            if (currentWidget.widget_type === 'marquee') {
                newConfig.text = document.getElementById('setting-text').value;
                newConfig.speed = parseInt(document.getElementById('setting-speed').value) || 10;
                newConfig.color = document.getElementById('setting-color').value;
                newConfig.fontSize = parseInt(document.getElementById('setting-size').value) || 48;
                newConfig.effect = document.getElementById('setting-effect').value;
            } else if (currentWidget.widget_type === 'slideshow') {
                newConfig.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                newConfig.transition = document.getElementById('setting-transition').value;
                // Images are updated directly in state via upload handler
            }

            const { error } = await supabase
                .from('p_widgets.widgets')
                .update({ config: newConfig, updated_at: new Date().toISOString() })
                .eq('id', currentWidget.id);

            if (error) {
                console.error(error);
                alertCustom("Ошибка", "Не удалось сохранить");
            } else {
                currentWidget.config = newConfig;
                updatePreview();
                
                // Show brief success indicator on button
                const btn = document.querySelector('button[onclick="saveWidget()"]');
                const origHtml = btn.innerHTML;
                btn.innerHTML = '<i class="fas fa-check"></i> Сохранено';
                btn.classList.replace('bg-blue-600', 'bg-green-600');
                setTimeout(() => {
                    btn.innerHTML = origHtml;
                    btn.classList.replace('bg-green-600', 'bg-blue-600');
                }, 2000);
            }
        }

        async function deleteCurrentWidget() {
            if (!currentWidget) return;
            
            // Simple confirmation logic without browser native confirm
            const btn = document.querySelector('button[onclick="deleteCurrentWidget()"]');
            if (btn.textContent.includes('Вы уверены?')) {
                const { error } = await supabase
                    .from('p_widgets.widgets')
                    .delete()
                    .eq('id', currentWidget.id);

                if (!error) {
                    currentWidget = null;
                    document.getElementById('editor-panel').classList.add('hidden');
                    document.getElementById('editor-panel').classList.remove('flex');
                    document.getElementById('empty-state').classList.remove('hidden');
                    await loadWidgets();
                }
                btn.innerHTML = '<i class="fas fa-trash-alt mr-1"></i> Удалить виджет';
            } else {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> Вы уверены? Нажмите еще раз';
                setTimeout(() => {
                    if(currentWidget) btn.innerHTML = '<i class="fas fa-trash-alt mr-1"></i> Удалить виджет';
                }, 3000);
            }
        }

        // --- 5. EDITOR UI GENERATION ---
        function buildSettingsForm() {
            const form = document.getElementById('settings-form');
            form.innerHTML = '';
            const c = currentWidget.config;

            if (currentWidget.widget_type === 'marquee') {
                form.innerHTML = `
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm text-slate-300 mb-1">Текст</label>
                        <input type="text" id="setting-text" value="${escapeHtml(c.text || '')}" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Скорость (сек)</label>
                        <input type="number" id="setting-speed" value="${c.speed || 10}" min="1" max="100" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Размер шрифта (px)</label>
                        <input type="number" id="setting-size" value="${c.fontSize || 48}" min="12" max="200" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Цвет текста</label>
                        <div class="flex gap-2">
                            <input type="color" id="setting-color" value="${c.color || '#ffffff'}" class="h-10 w-16 p-1 cursor-pointer bg-slate-800 border-slate-700" oninput="debouncePreview()">
                            <input type="text" value="${c.color || '#ffffff'}" class="flex-1" readonly>
                        </div>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Эффект</label>
                        <select id="setting-effect" onchange="debouncePreview()">
                            <option value="none" ${c.effect==='none'?'selected':''}>Нет</option>
                            <option value="glow" ${c.effect==='glow'?'selected':''}>Свечение (Неон)</option>
                            <option value="shadow" ${c.effect==='shadow'?'selected':''}>Тень</option>
                            <option value="outline" ${c.effect==='outline'?'selected':''}>Обводка</option>
                        </select>
                    </div>
                `;
            } else if (currentWidget.widget_type === 'slideshow') {
                form.innerHTML = `
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Задержка (сек)</label>
                        <input type="number" id="setting-delay" value="${c.delay || 5}" min="1" max="60" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Переход</label>
                        <select id="setting-transition" onchange="debouncePreview()">
                            <option value="fade" ${c.transition==='fade'?'selected':''}>Затухание (Fade)</option>
                        </select>
                    </div>
                    <div class="col-span-1 md:col-span-2 mt-4 border-t border-slate-700 pt-4">
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-sm font-semibold text-white">Изображения</label>
                            <label class="bg-slate-700 hover:bg-slate-600 px-3 py-1 rounded cursor-pointer text-sm transition">
                                <i class="fas fa-upload mr-1"></i> Загрузить
                                <input type="file" id="upload-image" accept="image/*" class="hidden" onchange="handleImageUpload(event)">
                            </label>
                        </div>
                        <div id="image-list" class="grid grid-cols-3 md:grid-cols-4 gap-2">
                            <!-- Images rendered here -->
                        </div>
                    </div>
                `;
                renderImageList();
            }
        }

        function renderImageList() {
            const list = document.getElementById('image-list');
            if(!list) return;
            list.innerHTML = '';
            
            const images = currentWidget.config.images || [];
            
            if(images.length === 0) {
                list.innerHTML = '<div class="col-span-full text-slate-500 text-sm text-center py-4 border border-dashed border-slate-700 rounded">Нет изображений</div>';
                return;
            }

            images.forEach((url, index) => {
                const div = document.createElement('div');
                div.className = 'relative aspect-video bg-slate-800 rounded group overflow-hidden border border-slate-700';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${index})" class="absolute top-1 right-1 bg-red-500/80 hover:bg-red-500 text-white w-6 h-6 rounded flex items-center justify-center opacity-0 group-hover:opacity-100 transition">
                        <i class="fas fa-times text-xs"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        async function handleImageUpload(event) {
            const file = event.target.files[0];
            if (!file) return;

            // Simple loading UI
            const label = event.target.parentElement;
            const originalHtml = label.innerHTML;
            label.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';

            try {
                // Upload to Supabase Storage in user's folder
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `${currentUser.id}/${fileName}`; // Enforces RLS policy

                const { data, error } = await supabase.storage
                    .from('p_widget_assets')
                    .upload(filePath, file);

                if (error) throw error;

                // Get public URL
                const { data: publicData } = supabase.storage
                    .from('p_widget_assets')
                    .getPublicUrl(filePath);

                // Add to config (Note: requires save to persist in DB)
                if (!currentWidget.config.images) currentWidget.config.images = [];
                currentWidget.config.images.push(publicData.publicUrl);
                
                renderImageList();
                updatePreview();
                saveWidget(); // Auto-save on image upload

            } catch (err) {
                console.error(err);
                alertCustom("Ошибка", "Не удалось загрузить изображение");
            } finally {
                label.innerHTML = originalHtml;
                event.target.value = ''; // Reset input
            }
        }

        function removeImage(index) {
            currentWidget.config.images.splice(index, 1);
            renderImageList();
            updatePreview();
            saveWidget();
        }

        // --- 6. PREVIEW & RENDER LOGIC ---
        let debounceTimer;
        function debouncePreview() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                // Temporarily update config object from DOM without saving to DB
                if (currentWidget.widget_type === 'marquee') {
                    currentWidget.config.text = document.getElementById('setting-text').value;
                    currentWidget.config.speed = parseInt(document.getElementById('setting-speed').value) || 10;
                    currentWidget.config.color = document.getElementById('setting-color').value;
                    currentWidget.config.fontSize = parseInt(document.getElementById('setting-size').value) || 48;
                    currentWidget.config.effect = document.getElementById('setting-effect').value;
                } else if (currentWidget.widget_type === 'slideshow') {
                    currentWidget.config.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                }
                updatePreview();
            }, 300);
        }

        function updatePreview() {
            const container = document.getElementById('preview-container');
            if(!container) return;
            renderWidget(currentWidget, container);
        }

        // Central render function used by both Studio Preview and OBS View
        function renderWidget(widget, container) {
            container.innerHTML = '';
            if (previewInterval) clearInterval(previewInterval);

            const c = widget.config;

            if (widget.widget_type === 'marquee') {
                const inner = document.createElement('div');
                inner.className = 'marquee-container';
                
                const span = document.createElement('div');
                span.className = 'marquee-content whitespace-nowrap font-bold';
                span.textContent = c.text || 'Текст';
                
                // Apply Styles
                span.style.color = c.color || '#fff';
                span.style.fontSize = `${c.fontSize || 48}px`;
                span.style.fontFamily = c.fontFamily || 'Inter';
                
                // Duration calculation based on 'speed'. 
                // Let's assume 'speed' is roughly seconds to cross the screen.
                span.style.animation = `marquee-left ${c.speed || 10}s linear infinite`;

                // Effects
                if(c.effect) {
                    span.classList.add(`effect-${c.effect}`);
                }

                inner.appendChild(span);
                container.appendChild(inner);

            } else if (widget.widget_type === 'slideshow') {
                const images = c.images || [];
                if (images.length === 0) {
                    container.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 font-bold">Нет изображений</div>';
                    return;
                }

                const wrap = document.createElement('div');
                wrap.className = 'slideshow-container';
                
                const slideElements = [];
                images.forEach((url, i) => {
                    const slide = document.createElement('div');
                    slide.className = `slideshow-slide ${i === 0 ? 'active' : ''}`;
                    slide.style.backgroundImage = `url('${url}')`;
                    wrap.appendChild(slide);
                    slideElements.push(slide);
                });

                container.appendChild(wrap);

                if (images.length > 1) {
                    let currentIndex = 0;
                    const delayMs = (c.delay || 5) * 1000;
                    
                    previewInterval = setInterval(() => {
                        slideElements[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % images.length;
                        slideElements[currentIndex].classList.add('active');
                    }, delayMs);
                }
            }
        }

        // --- 7. OBS VIEW LOGIC ---
        async function loadWidgetForOBS(id) {
            const container = document.getElementById('widget-renderer');
            container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Загрузка виджета...</div>';

            try {
                // Initial load
                const { data, error } = await supabase
                    .from('p_widgets.widgets')
                    .select('*')
                    .eq('id', id)
                    .single();

                if (error || !data) throw error;
                
                renderWidget(data, container);

                // Setup Realtime Subscription to update OBS source instantly when saved in editor!
                const channel = supabase.channel(`public:p_widgets.widgets:id=eq.${id}`)
                    .on('postgres_changes', { 
                        event: 'UPDATE', 
                        schema: 'p_widgets', 
                        table: 'widgets',
                        filter: `id=eq.${id}`
                    }, payload => {
                        console.log('Widget updated in realtime!', payload);
                        renderWidget(payload.new, container);
                    })
                    .subscribe();

            } catch (err) {
                console.error(err);
                container.innerHTML = '<div style="color:red; font-size:24px; text-shadow: 2px 2px 0 #000;">Ошибка: Виджет не найден или удален</div>';
            }
        }

        function copyObsUrl() {
            if(!currentWidget) return;
            
            const url = new URL(window.location.href);
            url.searchParams.set('widgetId', currentWidget.id);
            const finalUrl = url.toString();

            // Create temporary input to copy
            const tempInput = document.createElement("input");
            tempInput.value = finalUrl;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showMessage("Скопировано!", "Ссылка скопирована в буфер обмена. Вставьте её в OBS как источник 'Браузер' (Browser Source). Рекомендуемый размер: ширина 1920, высота 1080 (или по вкусу).");
        }


        // --- 8. UTILS ---
        function closeModal(id) {
            document.getElementById(id).classList.remove('active');
        }

        function showMessage(title, text) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-text').textContent = text;
            
            const icon = document.getElementById('msg-icon');
            if (title.toLowerCase().includes('ошибка')) {
                icon.className = 'fas fa-exclamation-triangle text-3xl mb-3 text-red-500';
            } else if (title.toLowerCase().includes('скопировано') || title.toLowerCase().includes('успех')) {
                icon.className = 'fas fa-check-circle text-3xl mb-3 text-green-500';
            } else {
                icon.className = 'fas fa-info-circle text-3xl mb-3 text-blue-500';
            }

            document.getElementById('msg-modal').classList.add('active');
        }

        // Custom alert to replace default window.alert
        function alertCustom(title, msg) {
            showMessage(title, msg);
        }

        function escapeHtml(unsafe) {
            return (unsafe||'').toString()
                 .replace(/&/g, "&amp;")
                 .replace(/</g, "&lt;")
                 .replace(/>/g, "&gt;")
                 .replace(/"/g, "&quot;")
                 .replace(/'/g, "&#039;");
         }

    </script>
</body>
