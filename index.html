<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMWIGET</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .custom-scroll::-webkit-scrollbar { height: 6px; width: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        .marquee-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .marquee-track-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }
        
        .marquee-content {
            display: inline-flex;
            align-items: center;
            will-change: transform;
            padding-right: 50px;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        .effect-glow { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
        .effect-shadow { text-shadow: 4px 4px 8px rgba(0,0,0,0.8); }
        .effect-outline { -webkit-text-stroke: var(--outline-width, 1px) var(--outline-color, #000); }
        .effect-glow-outline { 
            -webkit-text-stroke: var(--outline-width, 1px) var(--outline-color, #000);
            text-shadow: 0 0 15px currentColor; 
        }

        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .slideshow-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            z-index: 0;
        }

        /* Transition Classes */
        .trans-fade { transition: opacity 1s ease-in-out; }
        .trans-fade.active { opacity: 1; z-index: 1; }
        
        .trans-slide-left { transform: translateX(100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-left.active { opacity: 1; transform: translateX(0); z-index: 1; }
        .trans-slide-right { transform: translateX(-100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-right.active { opacity: 1; transform: translateX(0); z-index: 1; }
        
        .trans-slide-up { transform: translateY(100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-up.active { opacity: 1; transform: translateY(0); z-index: 1; }
        .trans-slide-down { transform: translateY(-100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-down.active { opacity: 1; transform: translateY(0); z-index: 1; }

        .trans-zoom-in { transform: scale(0.5); opacity: 0; transition: all 1.2s ease; }
        .trans-zoom-in.active { opacity: 1; transform: scale(1); z-index: 1; }
        .trans-zoom-out { transform: scale(1.5); opacity: 0; transition: all 1.2s ease; }
        .trans-zoom-out.active { opacity: 1; transform: scale(1); z-index: 1; }

        .trans-flip { transform: rotateY(90deg); opacity: 0; transition: all 0.8s ease-in; perspective: 1000px; }
        .trans-flip.active { opacity: 1; transform: rotateY(0deg); z-index: 1; transition-timing-function: ease-out;}

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(4px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        body.is-obs-mode { background-color: transparent !important; }

        .checkerboard-bg {
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }

        /* Mascot Styles */
        #mascot-container {
            position: fixed;
            z-index: 9999;
            cursor: pointer;
            will-change: transform;
            user-select: none;
        }
        #mascot-bubble {
            position: absolute;
            top: -40px;
            left: 50%;
            transform: translateX(-50%);
            background: white;
            color: black;
            padding: 4px 10px;
            border-radius: 12px;
            font-size: 12px;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            opacity: 0;
            transition: opacity 0.3s;
            pointer-events: none;
        }
        #mascot-bubble::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            border-width: 5px 5px 0;
            border-style: solid;
            border-color: white transparent transparent transparent;
        }
        #mascot-img {
            width: 100px;
            height: 100px;
            object-fit: contain;
            filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));
            transition: transform 0.3s;
        }
        #mascot-video-wrapper {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            overflow: hidden;
            display: none;
            box-shadow: 0 10px 25px rgba(0,0,0,0.6);
            border: 3px solid rgba(255,255,255,0.2);
            position: relative;
        }
        #mascot-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* Предотвращает появление нативных кнопок браузера (PiP) */
        }
        #mascot-container:hover #mascot-img {
            transform: scale(1.1) rotate(5deg);
        }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 selection:bg-blue-500/30">

    <!-- OBS Overlay View -->
    <div id="obs-view" class="w-screen h-screen bg-transparent overflow-hidden hidden absolute top-0 left-0">
        <div id="widget-renderer" class="w-full h-full"></div>
    </div>

    <!-- Main App UI -->
    <div id="app-container" class="min-h-screen flex flex-col hidden bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-slate-950">
        <nav class="bg-slate-900/50 backdrop-blur-md border-b border-white/5 p-3 sm:p-4 sticky top-0 z-10 shadow-lg">
            <div class="max-w-7xl mx-auto flex justify-between items-center gap-2">
                <div class="flex items-center gap-2 sm:gap-3 flex-shrink-0">
                    <div class="w-9 h-9 sm:w-10 sm:h-10 bg-blue-600/20 text-blue-500 rounded-xl flex items-center justify-center border border-blue-500/20 shadow-[0_0_15px_rgba(59,130,246,0.2)]">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="currentColor" class="w-5 h-5 sm:w-6 sm:h-6 drop-shadow-[0_0_8px_rgba(59,130,246,0.8)]">
                            <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />

        <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full flex flex-col md:flex-row gap-6">

                <div class="flex flex-col md:flex-row justify-between items-start md:items-center mb-6 border-b border-slate-700/50 pb-5 gap-4">

                        <div id="preview-container" class="w-full h-full relative"></div>
                    </div>
                </div>
                
                <div id="settings-form" class="grid grid-cols-1 md:grid-cols-2 gap-5"></div>

                        <path fill-rule="evenodd" d="M14.615 1.595a.75.75 0 01.359.852L12.982 9.75h7.268a.75.75 0 01.548 1.262l-10.5 11.25a.75.75 0 01-1.272-.71l1.992-7.302H3.75a.75.75 0 01-.548-1.262l10.5-11.25a.75.75 0 01.913-.143z" clip-rule="evenodd" />

                    <label class="block text-sm font-medium text-slate-300 mb-1.5">Пароль</label>

                </div>

    <!-- Create Widget Modal -->
    <div id="create-modal" class="modal px-4">

    <!-- Gift Selector Modal -->
    <div id="gift-selector-modal" class="modal px-4 z-[100]">

    <!-- Message Modal -->
    <div id="msg-modal" class="modal z-[150] px-4">
        <div class="bg-slate-900 border border-slate-700 p-6 rounded-2xl w-full max-w-sm text-center shadow-2xl">

        </div>
    </div>

    <script>
        // --- MASCOT LOGIC ---
        function initMascot() {
            const container = document.createElement('div');
            container.id = 'mascot-container';
            
            const bubble = document.createElement('div');
            bubble.id = 'mascot-bubble';
            bubble.textContent = 'нажми на меня';
            
            const img = document.createElement('img');
            img.id = 'mascot-img';
            img.src = 'Gemini_Generated_Image_hdls1shdls1shdls-Photoroom.png';
            img.onerror = () => { img.style.display = 'none'; }; // Hide if missing
            
            const videoWrapper = document.createElement('div');
            videoWrapper.id = 'mascot-video-wrapper';
            
            const video = document.createElement('video');
            video.id = 'mascot-video';
            video.src = 'video_2026-08-08_05-21-29.mp4';
            video.disablePictureInPicture = true; // Blocks PiP
            video.controls = false;
            
            videoWrapper.appendChild(video);
            container.appendChild(bubble);
            container.appendChild(img);
            container.appendChild(videoWrapper);
            document.body.appendChild(container);

            let x = Math.random() * (window.innerWidth - 150);
            let y = Math.random() * (window.innerHeight - 150);
            let vx = 1.5 * (Math.random() > 0.5 ? 1 : -1);
            let vy = 1.5 * (Math.random() > 0.5 ? 1 : -1);
            let isVideoPlaying = false;

            function animateMascot() {
                if(!document.getElementById('mascot-container')) return;
                
                const boundsW = isVideoPlaying ? 140 : 100;
                const boundsH = isVideoPlaying ? 140 : 100;

                x += vx;
                y += vy;
                
                // Safe bounce checks using innerHeight/innerWidth to prevent going off-screen
                if (x <= 0) { x = 0; vx *= -1; }
                if (x + boundsW >= window.innerWidth) { x = window.innerWidth - boundsW; vx *= -1; }
                
                if (y <= 0) { y = 0; vy *= -1; }
                if (y + boundsH >= window.innerHeight - 5) { y = window.innerHeight - boundsH - 5; vy *= -1; }

                container.style.transform = `translate(${x}px, ${y}px)`;
                requestAnimationFrame(animateMascot);
            }
            animateMascot();

            // Random bubble logic
            setInterval(() => {
                if(isVideoPlaying) return; // Don't show text if video is playing
                if (Math.random() > 0.6) {
                    bubble.style.opacity = '1';
                    setTimeout(() => { bubble.style.opacity = '0'; }, 3000);
                }
            }, 5000);

            // Click interaction
            container.addEventListener('click', () => {
                if (isVideoPlaying) return;
                
                bubble.style.opacity = '0';
                img.style.display = 'none';
                videoWrapper.style.display = 'block';
                isVideoPlaying = true;
                
                video.play().catch(e => console.error("Auto-play prevented", e));
            });

            video.addEventListener('ended', () => {
                videoWrapper.style.display = 'none';
                img.style.display = 'block';
                isVideoPlaying = false;

                            <div><label class="${labelClass}">Размер</label><input type="number" id="setting-size" value="${c.fontSize || 24}" min="10" max="100" oninput="debouncePreview()" class="${inputClass}"></div>
                            <div><label class="${labelClass}">Цвет текста</label><input type="color" id="setting-color" value="${c.color || '#ffffff'}" class="h-9 w-full rounded cursor-pointer border-0 bg-slate-900" oninput="debouncePreview()"></div>
                            <div class="col-span-2"><label class="${labelClass}">Эффект</label><select id="setting-effect" onchange="debouncePreview()" class="${inputClass}"><option value="none" ${c.effect==='none'?'selected':''}>Без эффекта</option><option value="glow" ${c.effect==='glow'?'selected':''}>Свечение</option><option value="shadow" ${c.effect==='shadow'?'selected':''}>Тень</option><option value="outline" ${c.effect==='outline'?'selected':''}>Обводка</option><option value="glow-outline" ${c.effect==='glow-outline'?'selected':''}>Обводка + Свечение</option></select></div>
                            <div><label class="${labelClass}">Цвет эффекта</label><input type="color" id="setting-outline-color" value="${c.outlineColor || '#000000'}" class="h-9 w-full rounded cursor-pointer border-0 bg-slate-900" oninput="debouncePreview()"></div>
                            <div><label class="${labelClass}">Ширина</label><input type="number" id="setting-outline-width" value="${c.outlineWidth || 2}" min="0" max="20" oninput="debouncePreview()" class="${inputClass}"></div>
                        </div>
                    </div>
                    <div class="col-span-1 md:col-span-2 mt-4 bg-slate-800/30 p-4 rounded-xl border border-slate-700/50">
                        <div class="flex justify-between items-center mb-5 border-b border-slate-700 pb-3">
                            <h4 class="text-sm font-semibold text-white"><i class="fas fa-layer-group mr-2 text-slate-400"></i>Управление строками (Изображения и Подарки)</h4>
                            <button onclick="addRow()" class="bg-blue-600 hover:bg-blue-500 text-white px-3 py-1.5 rounded-lg text-xs font-medium transition-all shadow-md"><i class="fas fa-plus mr-1"></i> Добавить строку</button>
                        </div>
                        <div id="rows-container" class="space-y-4"></div>
                    </div>
                `;
                renderRowsEditor();
            }
        }

        function renderRowsEditor() {
            const container = document.getElementById('rows-container');
            if(!container) return;
            container.innerHTML = '';
            
            const rows = currentWidget.config.rows || [];
            const isMarquee = currentWidget.widget_type === 'image-marquee';

            rows.forEach((row, index) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'bg-slate-900/80 border border-slate-700 rounded-xl p-4 relative group';
                
                let controlsHtml = '';
                if(isMarquee) {
                    controlsHtml = `
                    <div class="flex gap-4 mb-4">
                        <div class="flex-1"><label class="${labelClass} text-[10px]">Скорость (сек)</label><input type="number" value="${row.speed}" min="1" max="200" class="row-speed ${inputClass}" data-idx="${index}" oninput="updateRowConfig(this)"></div>
                        <div class="flex-1"><label class="${labelClass} text-[10px]">Направление</label><select class="row-dir ${inputClass}" data-idx="${index}" onchange="updateRowConfig(this)"><option value="left" ${row.direction==='left'?'selected':''}>Влево</option><option value="right" ${row.direction==='right'?'selected':''}>Вправо</option></select></div>
                    </div>`;
                }

                rowEl.innerHTML = `
                    <div class="flex justify-between items-center mb-4">
                        <h5 class="font-semibold text-slate-200 text-sm flex items-center"><span class="w-6 h-6 rounded-md bg-slate-800 border border-slate-600 flex items-center justify-center text-xs mr-2 text-slate-400">${index + 1}</span> Строка</h5>
                        <button onclick="removeRow(${index})" class="w-7 h-7 bg-red-500/10 hover:bg-red-500/20 text-red-400 hover:text-red-300 rounded-md flex items-center justify-center transition-colors"><i class="fas fa-times text-sm"></i></button>
                    </div>
                    ${controlsHtml}
                    <div class="bg-slate-950/50 p-3 rounded-lg border border-slate-800">
                        <div class="flex justify-between items-center mb-3">
                            <label class="block text-xs font-semibold text-slate-400">Содержимое (Смешанное)</label>
                            <div class="flex gap-2">
                                <label class="bg-slate-800 hover:bg-slate-700 border border-slate-600 text-white px-2 py-1.5 rounded cursor-pointer text-xs transition-colors"><i class="fas fa-image"></i> Фото <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${index})"></label>
                                <button onclick="openGiftSelector(${index})" class="bg-indigo-600/30 hover:bg-indigo-500/50 text-indigo-300 border border-indigo-500/50 px-2 py-1.5 rounded text-xs transition-colors"><i class="fas fa-gift"></i> Подарки</button>
                            </div>
                        </div>
                        <div id="row-items-${index}" class="flex gap-3 overflow-x-auto pb-2 custom-scroll"></div>
                    </div>
                `;
                container.appendChild(rowEl);
                renderRowItems(`row-items-${index}`, row, index);
            });
            
            if(rows.length === 0) container.innerHTML = '<div class="text-center text-slate-500 py-6 text-sm border border-dashed border-slate-700 rounded-xl">Нет созданных строк</div>';
        }

        function renderRowItems(containerId, row, rowIndex) {
            const list = document.getElementById(containerId);
            if(!list) return;
            list.innerHTML = '';
            
            const images = row.images || [];
            const gifts = row.gifts || [];

            if(images.length === 0 && gifts.length === 0) {
                list.innerHTML = '<div class="w-full text-slate-500 text-xs text-center py-6 border border-dashed border-slate-800 rounded-lg">Пусто. Загрузите фото или выберите подарки</div>';
                return;
            }

            // Render uploaded images
            images.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'relative flex-shrink-0 w-20 h-20 bg-slate-900 rounded-lg group overflow-hidden border border-slate-700 shadow-sm';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <button onclick="removeImage(${i}, ${rowIndex})" class="bg-red-500 text-white w-7 h-7 rounded flex items-center justify-center text-xs"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });

            // Render selected gifts
            gifts.forEach((giftId, i) => {
                const gift = giftLibrary.find(g => g.gift_id === giftId);
                if(!gift) return;
                
                const div = document.createElement('div');
                div.className = 'relative flex-shrink-0 w-20 h-20 bg-indigo-900/40 rounded-lg group overflow-hidden border border-indigo-700/50 shadow-sm flex flex-col items-center justify-center p-1';
                div.innerHTML = `
                    <img src="${gift.icon}" class="w-10 h-10 object-contain mb-1">
                    <div class="text-[9px] text-white font-medium truncate w-full text-center">${gift.name}</div>
                    <div class="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center">
                        <button onclick="removeGiftFromRow('${giftId}', ${rowIndex})" class="bg-red-500 text-white w-7 h-7 rounded flex items-center justify-center text-xs"><i class="fas fa-trash-alt"></i></button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        // --- GIFT SELECTOR MODAL LOGIC ---
        function openGiftSelector(rowIndex) {
            currentEditingRowIndex = rowIndex;
            const row = currentWidget.config.rows[rowIndex];
            tempSelectedGifts = [...(row.gifts || [])];
            renderGiftSelectorGrid();
            document.getElementById('gift-selector-modal').classList.add('active');
        }

        function renderGiftSelectorGrid() {
            const grid = document.getElementById('gift-selector-grid');
            if (giftLibrary.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-slate-500 text-center py-8">Библиотека подарков пуста</div>';
                return;
            }

            const selectedSet = new Set(tempSelectedGifts);
            
            grid.innerHTML = giftLibrary.map(g => {
                const isSelected = selectedSet.has(g.gift_id);
                return `
                    <div onclick="toggleGiftSelection('${g.gift_id}')" class="relative p-3 border ${isSelected ? 'border-blue-500 bg-blue-500/20 shadow-[0_0_15px_rgba(59,130,246,0.2)]' : 'border-slate-700 bg-slate-900/80 hover:border-slate-500'} rounded-xl cursor-pointer flex flex-col items-center justify-center transition-all group">
                        ${isSelected ? '<div class="absolute top-2 right-2 w-5 h-5 bg-blue-500 rounded-full flex items-center justify-center shadow-md"><i class="fas fa-check text-[10px] text-white"></i></div>' : ''}
                        <img src="${g.icon}" class="h-14 w-14 object-contain mb-2 drop-shadow-md">
                        <div class="text-xs text-slate-200 text-center w-full truncate font-medium mb-1">${g.name}</div>
                        <div class="text-[10px] text-yellow-400 font-bold bg-yellow-400/10 px-2 py-0.5 rounded border border-yellow-400/20">${g.cost} 🪙</div>
                    </div>
                `;
            }).join('');
        }

        function toggleGiftSelection(giftId) {
            const idx = tempSelectedGifts.indexOf(giftId);
            if(idx > -1) tempSelectedGifts.splice(idx, 1);
            else tempSelectedGifts.push(giftId);
            renderGiftSelectorGrid();
        }

        function toggleAllGiftsInSelector() {
            if(tempSelectedGifts.length === giftLibrary.length) tempSelectedGifts = [];
            else tempSelectedGifts = giftLibrary.map(g => g.gift_id);
            renderGiftSelectorGrid();
        }

        function saveSelectedGifts() {
            if(currentEditingRowIndex !== null && currentWidget) {
                currentWidget.config.rows[currentEditingRowIndex].gifts = [...tempSelectedGifts];
                renderRowItems(`row-items-${currentEditingRowIndex}`, currentWidget.config.rows[currentEditingRowIndex], currentEditingRowIndex);
                updatePreview();
                saveWidget();
            }
            closeModal('gift-selector-modal');
        }

        function removeGiftFromRow(giftId, rowIndex) {
            const row = currentWidget.config.rows[rowIndex];
            const idx = row.gifts.indexOf(giftId);
            if(idx > -1) row.gifts.splice(idx, 1);
            renderRowItems(`row-items-${rowIndex}`, row, rowIndex);
            updatePreview();
            saveWidget();
        }
        // -------------------------------

        function addRow() {
            currentWidget.config.rows.push({ id: Date.now().toString(), speed: 15, direction: 'left', images: [], gifts: [] });
            renderRowsEditor(); updatePreview(); saveWidget();
        }

        function removeRow(idx) {
            currentWidget.config.rows.splice(idx, 1);
            renderRowsEditor(); updatePreview(); saveWidget();
        }

        function updateRowConfig(el) {
            const idx = el.getAttribute('data-idx');
            if(el.classList.contains('row-speed')) currentWidget.config.rows[idx].speed = parseInt(el.value) || 15;
            if(el.classList.contains('row-dir')) currentWidget.config.rows[idx].direction = el.value;
            debouncePreview();
        }

        function renderImageList(containerId, images, rowIndex) {
            const list = document.getElementById(containerId);
            if(!list) return;
            list.innerHTML = '';
            if(images.length === 0) { list.innerHTML = '<div class="w-full text-slate-500 text-xs text-center py-6 border border-dashed border-slate-700 rounded-lg">Пусто</div>'; return; }
            images.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'relative flex-shrink-0 w-20 h-20 bg-slate-900 rounded-lg group overflow-hidden border border-slate-700 shadow-sm';
                div.innerHTML = `<img src="${url}" class="w-full h-full object-cover"><div class="absolute inset-0 bg-black/50 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center"><button onclick="removeImage(${i}, ${rowIndex})" class="bg-red-500 text-white w-8 h-8 rounded-full flex items-center justify-center text-xs"><i class="fas fa-trash-alt"></i></button></div>`;
                list.appendChild(div);
            });
        }

        async function handleImageUpload(event, rowIndex) {
            const file = event.target.files[0];
            if (!file) return;
            const label = event.target.parentElement;
            const originalHtml = label.innerHTML;
            label.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Загрузка...';
            label.classList.add('opacity-75', 'pointer-events-none');
            try {
                const fileExt = file.name.split('.').pop();
                const filePath = `${currentUser.id}/${Math.random().toString(36).substring(2)}.${fileExt}`;
                const { error } = await supabase.storage.from('p_widget_assets').upload(filePath, file);
                if (error) throw error;
                const { data: publicData } = supabase.storage.from('p_widget_assets').getPublicUrl(filePath);

                if (rowIndex !== null) {
                    if (!currentWidget.config.rows[rowIndex].images) currentWidget.config.rows[rowIndex].images = [];
                    currentWidget.config.rows[rowIndex].images.push(publicData.publicUrl);
                    renderRowItems(`row-items-${rowIndex}`, currentWidget.config.rows[rowIndex], rowIndex);
                } else {
                    if (!currentWidget.config.images) currentWidget.config.images = [];
                    currentWidget.config.images.push(publicData.publicUrl);
                    renderImageList('image-list-global', currentWidget.config.images, null);
                }
                updatePreview(); saveWidget();
            } catch (err) { console.error(err); alertCustom("Ошибка", "Сбой загрузки изображения"); } 
            finally { label.innerHTML = originalHtml; label.classList.remove('opacity-75', 'pointer-events-none'); event.target.value = ''; }
        }

        function removeImage(imgIndex, rowIndex) {
            if (rowIndex !== null) {
                currentWidget.config.rows[rowIndex].images.splice(imgIndex, 1);
                renderRowItems(`row-items-${rowIndex}`, currentWidget.config.rows[rowIndex], rowIndex);
            } else {
                currentWidget.config.images.splice(imgIndex, 1);
                renderImageList('image-list-global', currentWidget.config.images, null);
            }
            updatePreview(); saveWidget();
        }

        function syncFormToConfig() {
            if (!currentWidget) return;
            const c = currentWidget.config;
            if (currentWidget.widget_type === 'marquee') {
                c.text = document.getElementById('setting-text').value; c.fontFamily = document.getElementById('setting-font').value;
                c.speed = parseInt(document.getElementById('setting-speed').value) || 15; c.color = document.getElementById('setting-color').value;
                c.fontSize = parseInt(document.getElementById('setting-size').value) || 64; c.effect = document.getElementById('setting-effect').value;
                c.outlineColor = document.getElementById('setting-outline-color').value; c.outlineWidth = parseInt(document.getElementById('setting-outline-width').value) || 2;
            } else if (currentWidget.widget_type === 'slideshow') {
                c.delay = parseInt(document.getElementById('setting-delay').value) || 5; c.transition = document.getElementById('setting-transition').value;
                c.objectFit = document.getElementById('setting-fit').value;
            } else if (currentWidget.widget_type === 'image-marquee' || currentWidget.widget_type === 'multi-slideshow') {
                c.imageHeight = parseInt(document.getElementById('setting-img-height').value) || 120;
                c.gap = parseInt(document.getElementById('setting-gap').value) || 20;
                
                c.textTemplate = document.getElementById('setting-template').value;
                c.fontFamily = document.getElementById('setting-font').value;
                c.fontSize = parseInt(document.getElementById('setting-size').value) || 24;
                c.color = document.getElementById('setting-color').value;
                c.effect = document.getElementById('setting-effect').value;
                c.outlineColor = document.getElementById('setting-outline-color').value;
                c.outlineWidth = parseInt(document.getElementById('setting-outline-width').value) || 2;
                c.textPosition = document.getElementById('setting-text-pos').value;

                if (currentWidget.widget_type === 'multi-slideshow') {
                    c.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                    c.transition = document.getElementById('setting-transition').value;
                    c.objectFit = document.getElementById('setting-fit').value;
                    c.rowHeight = parseInt(document.getElementById('setting-row-height').value) || 200;
                }
            }
        }

        function debouncePreview() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => { syncFormToConfig(); updatePreview(); }, 300);
        }

        function loadFont(fontName) {
            if (!fontName || loadedFonts.has(fontName) || fontName === 'Inter') return;
            const id = 'font-' + fontName.replace(/\s+/g, '-');
            if (!document.getElementById(id)) {
                const link = document.createElement('link'); link.id = id; link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;700;900&display=swap`;
                document.head.appendChild(link); loadedFonts.add(fontName);
            }
        }

        // Helper to build a gift UI element based on config
        function buildGiftPreviewElement(giftData, config) {
            const item = document.createElement('div');
            item.style.position = 'relative';
            item.style.display = 'flex';
            item.style.alignItems = 'center';
            item.style.justifyContent = 'center';
            
            if (config.textPosition === 'top') item.style.flexDirection = 'column-reverse';
            else if (config.textPosition === 'bottom') item.style.flexDirection = 'column';
            
            const img = document.createElement('img');
            img.src = giftData.icon;
            img.style.height = `${config.imageHeight || 120}px`;
            img.className = "object-contain drop-shadow-xl";
            
            const text = document.createElement('div');
            let tpl = config.textTemplate || '{name}';
            tpl = tpl.replace(/{name}/g, giftData.name).replace(/{cost}/g, giftData.cost);
            text.textContent = tpl;
            text.style.fontFamily = `"${config.fontFamily || 'Inter'}", sans-serif`;
            text.style.fontSize = `${config.fontSize || 24}px`;
            text.style.color = config.color || '#fff';
            text.style.fontWeight = 'bold';
            text.style.textAlign = 'center';
            text.style.whiteSpace = 'nowrap';
            text.style.zIndex = '2';
            
            if (config.textPosition === 'center') {
                text.style.position = 'absolute'; text.style.top = '50%'; text.style.left = '50%'; text.style.transform = 'translate(-50%, -50%)';
            } else {
                text.style.marginTop = config.textPosition === 'bottom' ? '12px' : '0';
                text.style.marginBottom = config.textPosition === 'top' ? '12px' : '0';
            }
            
            if(config.effect && config.effect !== 'none') text.classList.add(`effect-${config.effect}`);
            text.style.setProperty('--outline-color', config.outlineColor || '#000');
            text.style.setProperty('--outline-width', `${config.outlineWidth || 2}px`);
            
            item.appendChild(img);
            if (tpl.trim() !== '') item.appendChild(text);
            return item;
        }

        function updatePreview() {
            const container = document.getElementById('preview-container');
            if(!container) return;
            renderWidget(currentWidget, container);
        }

        function renderWidget(widget, container) {
            container.innerHTML = '';
            if (previewInterval) { clearInterval(previewInterval); previewInterval = null; }
            if (previewIntervals) { previewIntervals.forEach(clearInterval); previewIntervals = []; }
            
            const c = widget.config;

            if (widget.widget_type === 'marquee') {
                loadFont(c.fontFamily);
                const wrapper = document.createElement('div'); wrapper.className = 'marquee-wrapper';
                const track = document.createElement('div'); track.className = 'marquee-track-container';
                const buildContent = () => {
                    const span = document.createElement('div'); span.className = 'marquee-content font-bold';
                    span.textContent = c.text || 'Текст'; span.style.color = c.color || '#fff';
                    span.style.fontSize = `${c.fontSize || 64}px`; span.style.fontFamily = `"${c.fontFamily || 'Inter'}", sans-serif`;
                    span.style.animation = `marquee-left ${c.speed || 15}s linear infinite`;
                    if(c.effect && c.effect !== 'none') span.classList.add(`effect-${c.effect}`);
                    span.style.setProperty('--outline-color', c.outlineColor || '#000'); span.style.setProperty('--outline-width', `${c.outlineWidth || 2}px`);
                    return span;
                };
                track.appendChild(buildContent()); track.appendChild(buildContent()); 
                wrapper.appendChild(track); container.appendChild(wrapper);
            } 
            else if (widget.widget_type === 'image-marquee') {
                loadFont(c.fontFamily);
                const wrapper = document.createElement('div');
                wrapper.className = 'marquee-wrapper'; wrapper.style.gap = `${c.gap || 20}px`;

                (c.rows || []).forEach(row => {
                    const images = row.images || []; const gifts = row.gifts || [];
                    if(images.length === 0 && gifts.length === 0) return;
                    
                    const track = document.createElement('div'); track.className = 'marquee-track-container';
                    
                    const buildTrackContent = () => {
                        const content = document.createElement('div');
                        content.className = 'marquee-content flex items-center';
                        content.style.gap = '30px'; // fixed inner gap
                        content.style.animation = `marquee-${row.direction || 'left'} ${row.speed || 15}s linear infinite`;
                        
                        images.forEach(url => {
                            const img = document.createElement('img'); img.src = url; img.style.height = `${c.imageHeight || 120}px`;
                            img.className = "rounded shadow-lg object-contain"; content.appendChild(img);
                        });
                        
                        gifts.forEach(giftId => {
                            const gData = giftLibrary.find(g => g.gift_id === giftId);
                            if(gData) content.appendChild(buildGiftPreviewElement(gData, c));
                        });
                        return content;
                    };
                    track.appendChild(buildTrackContent()); track.appendChild(buildTrackContent());
                    wrapper.appendChild(track);
                });
                
                if(wrapper.children.length === 0) wrapper.innerHTML = '<div class="text-slate-500 text-sm font-medium m-auto">Добавьте фото/подарки в строки</div>';
                container.appendChild(wrapper);
            }
            else if (widget.widget_type === 'slideshow') {
                const images = c.images || [];
                if (images.length === 0) { container.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 font-medium text-sm">Добавьте фото</div>'; return; }
                const wrap = document.createElement('div'); wrap.className = 'slideshow-container';
                const slideElements = [];
                images.forEach((url, i) => {
                    const slide = document.createElement('div');
                    slide.className = `slideshow-slide trans-${c.transition || 'fade'} ${i === 0 ? 'active' : ''}`;
                    slide.style.backgroundImage = `url('${url}')`; slide.style.backgroundSize = c.objectFit || 'contain';
                    wrap.appendChild(slide); slideElements.push(slide);
                });
                container.appendChild(wrap);
                if (images.length > 1) {
                    let currentIndex = 0; const delayMs = (c.delay || 5) * 1000;
                    previewInterval = setInterval(() => {
                        slideElements[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % images.length;
                        slideElements[currentIndex].classList.add('active');
                    }, delayMs);
                }
            }
            else if (widget.widget_type === 'multi-slideshow') {
                loadFont(c.fontFamily);
                const wrapper = document.createElement('div');
                wrapper.className = 'w-full h-full flex flex-col justify-center'; wrapper.style.gap = `${c.gap || 20}px`;

                (c.rows || []).forEach(row => {
                    const rowContainer = document.createElement('div');
                    rowContainer.style.height = `${c.rowHeight || 200}px`; rowContainer.style.width = '100%';
                    rowContainer.style.position = 'relative'; rowContainer.style.overflow = 'hidden';

                    const images = row.images || []; const gifts = row.gifts || [];
                    if (images.length === 0 && gifts.length === 0) {
                        rowContainer.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500/50 bg-slate-800/30 border border-dashed border-slate-700 rounded-lg text-sm">Пустая строка</div>';
                        wrapper.appendChild(rowContainer); return;
                    }

                    const slideElements = [];
                    let indexCount = 0;

                    images.forEach((url) => {
                        const slide = document.createElement('div');
                        slide.className = `slideshow-slide trans-${c.transition || 'fade'} ${indexCount === 0 ? 'active' : ''}`;
                        slide.style.backgroundImage = `url('${url}')`; slide.style.backgroundSize = c.objectFit || 'contain';
                        rowContainer.appendChild(slide); slideElements.push(slide);
                        indexCount++;
                    });

                    gifts.forEach((giftId) => {
                        const gData = giftLibrary.find(g => g.gift_id === giftId);
                        if(gData) {
                            const slide = document.createElement('div');
                            slide.className = `slideshow-slide trans-${c.transition || 'fade'} ${indexCount === 0 ? 'active' : ''} flex items-center justify-center`;
                            slide.appendChild(buildGiftPreviewElement(gData, c));
                            rowContainer.appendChild(slide); slideElements.push(slide);
                            indexCount++;
                        }
                    });

                    wrapper.appendChild(rowContainer);

                    if (slideElements.length > 1) {
                        let currentIndex = 0; const delayMs = (c.delay || 5) * 1000;
                        const interval = setInterval(() => {
                            slideElements[currentIndex].classList.remove('active');
                            currentIndex = (currentIndex + 1) % slideElements.length;
                            slideElements[currentIndex].classList.add('active');
                        }, delayMs);
                        previewIntervals.push(interval);
                    }
                });
                
                if(wrapper.children.length === 0) wrapper.innerHTML = '<div class="text-slate-500 text-sm font-medium m-auto">Добавьте строки</div>';
                container.appendChild(wrapper);
            }
        }

        async function loadWidgetForOBS(id) {
            const container = document.getElementById('widget-renderer');
            container.innerHTML = '<div style="color:rgba(255,255,255,0.5); font-family:sans-serif; text-align:center; padding:20px; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">Загрузка...</div>';
            try {
                const { data, error } = await supabase.from('p_widgets').select('*').eq('id', id).single();
                if (error || !data) throw error;
                renderWidget(data, container);
                supabase.channel(`public:p_widgets:id=eq.${id}`).on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'p_widgets', filter: `id=eq.${id}` }, payload => {
                    renderWidget(payload.new, container);
                }).subscribe();
            } catch (err) {
                container.innerHTML = '<div style="color:red; font-family:sans-serif; font-size:24px; font-weight:bold; position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);">Ошибка: Виджет не найден</div>';
            }
        }

        function copyObsUrl() {
            if(!currentWidget) return;
            const url = new URL(window.location.href); url.searchParams.set('widgetId', currentWidget.id);
            const tempInput = document.createElement("input"); tempInput.value = url.toString();
            document.body.appendChild(tempInput); tempInput.select(); document.execCommand("copy"); document.body.removeChild(tempInput);
            showMessage("Скопировано!", "Ссылка скопирована. Вставьте её в OBS (Browser Source, 1920x1080).");
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        function showMessage(title, text) {
            document.getElementById('msg-title').textContent = title; document.getElementById('msg-text').textContent = text;
            const icon = document.getElementById('msg-icon');
            icon.className = title.includes('Ошибка') ? 'fas fa-exclamation-triangle text-5xl mb-4 text-red-500' :
                             title.includes('Успех') || title.includes('Скопировано') ? 'fas fa-check-circle text-5xl mb-4 text-green-500' : 'fas fa-info-circle text-5xl mb-4 text-blue-500';
            document.getElementById('msg-modal').classList.add('active');
        }
        function alertCustom(title, msg) { showMessage(title, msg); }
        function escapeHtml(unsafe) { return (unsafe||'').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;"); }
    </script>
</body>
