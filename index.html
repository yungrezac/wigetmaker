    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        .custom-scroll::-webkit-scrollbar { height: 6px; }
        .custom-scroll::-webkit-scrollbar-track { background: transparent; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 3px; }

        .marquee-wrapper {
            width: 100%;
            min-height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .marquee-track-container {
            width: 100%;
            white-space: nowrap;
            overflow: visible; /* Чтобы подарки не обрезались */
            box-sizing: border-box;
            display: flex;
            align-items: center;
            padding: 20px 0; /* Защитный отступ сверху и снизу */
        }
        
        .marquee-content {
            display: inline-flex;
            align-items: center;
            will-change: transform;
            padding-right: 50px;
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        
        .slideshow-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            opacity: 0;
            z-index: 0;
            padding: 20px; /* Защита от краев */
            box-sizing: border-box;
        }

        /* Переходы Слайдшоу */
        .trans-fade { transition: opacity 1s ease-in-out; }
        .trans-fade.active { opacity: 1; z-index: 1; }
        
        .trans-slide-left { transform: translateX(100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-left.active { opacity: 1; transform: translateX(0); z-index: 1; }
        .trans-slide-right { transform: translateX(-100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-right.active { opacity: 1; transform: translateX(0); z-index: 1; }
        
        .trans-zoom-in { transform: scale(0.5); opacity: 0; transition: all 1.2s ease; }
        .trans-zoom-in.active { opacity: 1; transform: scale(1); z-index: 1; }

        /* Модальные окна */
        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(5px);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        body.is-obs-mode {
            background-color: transparent !important;
        }

        .checkerboard-bg {
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
        
        .range-slider {
            -webkit-appearance: none;
            width: 100%;
            height: 6px;
            background: #334155;
            border-radius: 5px;
            outline: none;
        }
        .range-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            transition: 0.2s;
        }
        .range-slider::-webkit-slider-thumb:hover { transform: scale(1.2); }
    </style>
</head>

    <script>
        var SUPABASE_URL = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var currentUser = null, widgets = [], currentWidget = null, allGifts = [];
        var previewIntervals = [], debounceTimer = null, loadedFonts = new Set();
        var editingGiftContext = null; 

        const inputClass = "w-full bg-slate-950/50 border border-slate-700 focus:border-blue-500 text-white rounded-lg px-3 py-2 text-sm outline-none";
        const labelClass = "block text-xs font-medium text-slate-400 mb-1.5";

        const GOOGLE_FONTS = [
            "Inter", "Roboto", "Montserrat", "Open Sans", "Oswald", "Raleway", 
            "Nunito", "Rubik", "Ubuntu", "PT Sans", "Merriweather", "Lora",
            "Playfair Display", "Caveat", "Pacifico", "Russo One", "Seymour One",
            "Jura", "Marck Script", "Neucha", "Alice"
        ];

        var DEFAULT_CONFIGS = {
            'multi-slideshow': { delay: 5, rowHeight: 200, gap: 20, font: 'Inter', rows: [{ id: Date.now().toString(), speed: 15, direction: 'left', items: [] }] },
            'slideshow': { delay: 5, transition: 'fade', objectFit: 'contain', rowHeight: 300, font: 'Inter', items: [] }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const isObs = new URLSearchParams(window.location.search).get('widgetId');
            if (isObs) {
                document.body.classList.add('is-obs-mode');
                document.getElementById('obs-view').style.display = 'block';
                loadWidgetForOBS(isObs);
            } else {
                document.getElementById('app-container').classList.remove('hidden');
                initMascot(); // Запускаем маскота ТОЛЬКО если это не OBS
                checkAuth();
                fetchGiftsFromDB();
            }
        });

        /* --- ЛОГИКА МАСКОТА --- */
        function initMascot() {
            const mascot = document.createElement('div');
            mascot.id = 'mascot-container';
            // Строго позиционируем в 0,0, чтобы избежать сброса вниз при рендеринге интерфейса
            mascot.style.cssText = 'position:fixed; top:0; left:0; z-index:9999; cursor:pointer; will-change:transform; display:flex; align-items:center; justify-center;';

            // Картинка (120px)
            const imgWrap = document.createElement('div');
            imgWrap.style.cssText = 'width: 120px; height: 120px; transition: opacity 0.3s;';
            imgWrap.innerHTML = '<img src="Gemini_Generated_Image_hdls1shdls1shdls-Photoroom.png" style="width:100%; height:100%; object-fit:contain; filter: drop-shadow(0 10px 15px rgba(0,0,0,0.5));">';

            // Видео в круге (160px - чуть больше картинки)
            const vidWrap = document.createElement('div');
            vidWrap.style.cssText = 'width: 160px; height: 160px; border-radius: 50%; overflow: hidden; display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.8); border: 4px solid #3b82f6;';
            vidWrap.innerHTML = '<video src="video_2026-08-08_05-21-29.mp4" style="width:100%; height:100%; object-fit:cover; pointer-events:none;" disablePictureInPicture playsinline></video>';

            // Облачко текста
            const speech = document.createElement('div');
            speech.style.cssText = 'position:absolute; top:-30px; left:50%; transform:translateX(-50%); background:white; color:black; padding:4px 10px; border-radius:10px; font-weight:bold; font-size:12px; white-space:nowrap; opacity:0; transition:opacity 0.3s; pointer-events:none; box-shadow: 0 4px 6px rgba(0,0,0,0.2);';
            speech.innerText = 'нажми на меня';

            mascot.appendChild(imgWrap);
            mascot.appendChild(vidWrap);
            mascot.appendChild(speech);
            document.body.appendChild(mascot);

            let x = Math.random() * (window.innerWidth - 160);
            let y = Math.random() * (window.innerHeight - 160);
            let vx = 1.5;
            let vy = 1.5;
            let isVideo = false;

            // Функция плавного движения
            function animate() {
                // Динамический расчет границ отталкивания
                const currentW = isVideo ? 160 : 120;
                const currentH = isVideo ? 160 : 120;
                const maxX = window.innerWidth - currentW;
                const maxY = window.innerHeight - currentH - 5; // -5px чтобы точно не цеплял скроллбар снизу

                x += vx;
                y += vy;

                if (x <= 0) { x = 0; vx *= -1; }
                else if (x >= maxX) { x = maxX; vx *= -1; }

                if (y <= 0) { y = 0; vy *= -1; }
                else if (y >= maxY) { y = maxY; vy *= -1; }

                mascot.style.transform = `translate(${x}px, ${y}px)`;
                requestAnimationFrame(animate);
            }
            requestAnimationFrame(animate); // Запуск бесконечного цикла

            // Случайные появления облачка
            let speechInterval = setInterval(() => {
                if(!isVideo && Math.random() > 0.5) {
                    speech.style.opacity = '1';
                    setTimeout(() => speech.style.opacity = '0', 2500);
                }
            }, 5000);

            // Обработка клика
            mascot.addEventListener('click', () => {
                if(isVideo) return;
                isVideo = true;
                
                speech.style.opacity = '0';
                imgWrap.style.display = 'none';
                vidWrap.style.display = 'block';

                // Корректировка позиций, чтобы при увеличении размера он не вылез за края
                if (x > window.innerWidth - 160) x = window.innerWidth - 160;
                if (y > window.innerHeight - 165) y = window.innerHeight - 165;

                const v = vidWrap.querySelector('video');
                v.currentTime = 0;
                v.volume = 1;
                v.play().catch(e => console.log('Autoplay issue:', e));

                v.onended = () => {
                    isVideo = false;
                    vidWrap.style.display = 'none';
                    imgWrap.style.display = 'block';
                };
            });
        }

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();

                currentUser = session.user;
                document.getElementById('auth-modal').classList.remove('active');
                document.getElementById('user-display').innerHTML = `<i class="fas fa-user-circle mr-1.5 text-slate-400"></i><span class="truncate">${currentUser.email}</span>`;

                document.getElementById('auth-modal').classList.add('active');

        async function handleLogin() {
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            if(!email || !password) return;
            const btn = document.querySelector('#auth-modal button');
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

        function editGift(iIdx, rIdx) {
            const arr = rIdx !== null ? currentWidget.config.rows[rIdx].items : currentWidget.config.items;
            const item = arr[iIdx];
            editingGiftContext = { rIdx, iIdx, item };
            
            document.getElementById('gs-text').value = item.text || '';
            document.getElementById('gs-size').value = item.size || 24;
            document.getElementById('gs-offset-y').value = item.offsetY || 0;
            document.getElementById('gs-color').value = item.color || '#ffffff';
            document.getElementById('gs-stroke').value = item.stroke !== undefined ? item.stroke : 3;
            document.getElementById('gs-stroke-color').value = item.strokeColor || '#000000';
            
            document.getElementById('gift-settings-modal').classList.add('active');
            updateLiveGiftPreview();
        }

        function updateLiveGiftPreview() {
            if(!editingGiftContext) return;
            const font = document.getElementById('setting-global-font').value || 'Inter';
            loadFont(font);

            const text = document.getElementById('gs-text').value;
            const size = document.getElementById('gs-size').value;
            const y = document.getElementById('gs-offset-y').value;
            const color = document.getElementById('gs-color').value;
            const stroke = parseInt(document.getElementById('gs-stroke').value);
            const sColor = document.getElementById('gs-stroke-color').value;

            document.getElementById('gs-size-val').innerText = `${size}px`;
            document.getElementById('gs-y-val').innerText = `${y}px`;
            document.getElementById('gs-stroke-val').innerText = `${stroke}px`;

            const wrap = document.getElementById('live-gift-preview');
            wrap.innerHTML = '';
            
            const cont = document.createElement('div');
            cont.className = 'relative flex flex-col items-center justify-center w-full h-full';
            
            const img = document.createElement('img');
            img.src = editingGiftContext.item.url;
            img.style.height = '80px';
            img.style.objectFit = 'contain';
            
            const txt = document.createElement('div');
            txt.innerHTML = text.replace(/\\n/g, '<br>');
            txt.style.fontFamily = `"${font}", sans-serif`;
            txt.style.fontSize = `${size}px`;
            txt.style.color = color;
            txt.style.fontWeight = '900';
            txt.style.textAlign = 'center';
            txt.style.lineHeight = '1.1';
            txt.style.position = 'relative';
            txt.style.top = `${y}px`;
            txt.style.textShadow = getSolidTextShadow(sColor, stroke);

            cont.appendChild(img);
            cont.appendChild(txt);
            wrap.appendChild(cont);
        }

        function getSolidTextShadow(color, w) {
            if(!w || w<=0) return 'none';
            let shadows = [];
            const steps = 8;
            for(let i=0; i<steps; i++) {
                const a = (i * 2 * Math.PI) / steps;
                shadows.push(`${(Math.cos(a)*w).toFixed(1)}px ${(Math.sin(a)*w).toFixed(1)}px 0 ${color}`);
            }
            if(w>2) { // Заполнение дырок для толстой обводки
                for(let i=0; i<steps; i++) {
                    const a = (i * 2 * Math.PI) / steps;
                    shadows.push(`${(Math.cos(a)*(w/2)).toFixed(1)}px ${(Math.sin(a)*(w/2)).toFixed(1)}px 0 ${color}`);
                }
            }
            return shadows.join(', ');
        }

        function saveGiftSettings() {
            const { rIdx, iIdx, item } = editingGiftContext;
            item.text = document.getElementById('gs-text').value;
            item.size = document.getElementById('gs-size').value;
            item.offsetY = document.getElementById('gs-offset-y').value;
            item.color = document.getElementById('gs-color').value;
            item.stroke = parseInt(document.getElementById('gs-stroke').value);
            item.strokeColor = document.getElementById('gs-stroke-color').value;
            
            closeModal('gift-settings-modal');
            buildSettingsForm(); updatePreview(); saveWidget();
        }

        function syncFormToConfig() {
            if (!currentWidget) return;
            const c = currentWidget.config;
            c.font = document.getElementById('setting-global-font')?.value || 'Inter';
            if (currentWidget.widget_type === 'slideshow') {
                c.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                c.rowHeight = parseInt(document.getElementById('setting-row-height').value) || 300;
            } else {
                c.rowHeight = parseInt(document.getElementById('setting-row-height').value) || 200;
                c.gap = parseInt(document.getElementById('setting-gap').value) || 0;
            }
        }

        function debouncePreview() { clearTimeout(debounceTimer); debounceTimer = setTimeout(() => { syncFormToConfig(); updatePreview(); }, 200); }
        function loadFont(f) { if(!f || f==='Inter' || loadedFonts.has(f)) return; const id = 'font-'+f.replace(/\s+/g,'-'); if(!document.getElementById(id)) { const l = document.createElement('link'); l.id=id; l.rel='stylesheet'; l.href=`https://fonts.googleapis.com/css2?family=${f.replace(/\s+/g,'+')}:wght@400;700;900&display=swap`; document.head.appendChild(l); loadedFonts.add(f); } }

        function resizePreview() {
            const bounds = document.getElementById('preview-bounds');
            const container = document.getElementById('preview-container');
            const dimLabel = document.getElementById('obs-dimensions');
            if(!bounds || !container) return;
            
            container.style.height = 'auto'; // Сброс для измерения
            let h = container.scrollHeight;
            h = Math.max(600, h); // Минимум 600 как в OBS
            container.style.height = `${h}px`;
            
            const scale = bounds.clientWidth / 800; // Ширина всегда 800
            container.style.transform = `scale(${scale})`;
            bounds.style.height = `${h * scale}px`; // Растягиваем видимый блок
            if(dimLabel) dimLabel.textContent = `(Холст OBS: 800x${h})`;
        }

        function updatePreview() {
            const c = document.getElementById('preview-container');
            if(c) { renderWidget(currentWidget, c); setTimeout(resizePreview, 50); }
        }

        // Общий билдер DOM элемента (Фото или Подарок)
        function createDOMItem(item, configH, font) {
            const el = document.createElement('div');
            el.style.display = 'flex'; el.style.flexDirection = 'column'; el.style.alignItems = 'center'; el.style.justifyContent = 'center'; el.style.position = 'relative';
            
            if (item.type === 'image') {
                el.innerHTML = `<img src="${item.url}" style="height:${configH}px; max-width:100%; object-fit:contain;">`;
            } else {
                const sizeH = configH * 0.7; // Картинка занимает 70% высоты
                el.innerHTML = `
                    <img src="${item.url}" style="height:${sizeH}px; object-fit:contain; filter:drop-shadow(0 10px 10px rgba(0,0,0,0.5));">
                    <div style="font-family:'${font}', sans-serif; font-size:${item.size}px; color:${item.color}; font-weight:900; text-align:center; line-height:1.1; white-space:pre-wrap; text-shadow:${getSolidTextShadow(item.strokeColor, item.stroke)}; position:relative; top:${item.offsetY}px;">${(item.text||'').replace(/\\n/g,'\n')}</div>
                `;
            }
            return el;
        }

        function renderWidget(widget, container) {
            container.innerHTML = '';
            previewIntervals.forEach(clearInterval); previewIntervals = [];
            const c = widget.config;
            loadFont(c.font);

            if (widget.widget_type === 'slideshow') {
                const items = c.items || [];
                if(items.length===0) { container.innerHTML='<div class="flex items-center justify-center w-full h-full text-slate-500">Пусто</div>'; return; }
                
                const wrap = document.createElement('div');
                wrap.className = 'slideshow-container';
                wrap.style.height = `${c.rowHeight || 300}px`;
                
                const slides = [];
                items.forEach((item, i) => {
                    const slide = document.createElement('div');
                    slide.className = `slideshow-slide trans-fade ${i===0?'active':''}`;
                    slide.appendChild(createDOMItem(item, c.rowHeight, c.font));
                    wrap.appendChild(slide);
                    slides.push(slide);
                });
                container.appendChild(wrap);

                if (items.length > 1) {
                    let idx = 0;
                    previewIntervals.push(setInterval(() => {
                        slides[idx].classList.remove('active');
                        idx = (idx + 1) % items.length;
                        slides[idx].classList.add('active');
                    }, (c.delay||5)*1000));
                }
            } 
            else if (widget.widget_type === 'multi-slideshow') {
                const wrap = document.createElement('div');
                wrap.className = 'marquee-wrapper';
                // ВАЖНО: Отрицательные отступы! Мы не используем gap у родителя. 
                // Мы будем задавать margin-top дочерним строкам.
                
                (c.rows || []).forEach((row, i) => {
                    const track = document.createElement('div');
                    track.className = 'marquee-track-container';
                    if (i > 0) track.style.marginTop = `${c.gap}px`; // Поддержка отрицательных отступов

                    if(!row.items || row.items.length===0) return;
                    
                    const buildCont = () => {
                        const content = document.createElement('div');
                        content.className = 'marquee-content flex items-center gap-10'; // Фиксированный gap между элементами в строке
                        content.style.animation = `marquee-${row.direction||'left'} ${row.speed||15}s linear infinite`;
                        
                        row.items.forEach(item => {
                            content.appendChild(createDOMItem(item, c.rowHeight, c.font));
                        });
                        return content;
                    };
                    track.appendChild(buildCont());
                    track.appendChild(buildCont());
                    wrap.appendChild(track);
                });
                container.appendChild(wrap);
            }
        }

        async function loadWidgetForOBS(id) {
            const container = document.getElementById('widget-renderer');
            try {
                const { data, error } = await supabase.from('p_widgets').select('*').eq('id', id).single();
                if (error) throw error;
                renderWidget(data, container);
                supabase.channel(`public:p_widgets:id=eq.${id}`)
                    .on('postgres_changes', { event:'UPDATE', schema:'public', table:'p_widgets', filter:`id=eq.${id}` }, p => renderWidget(p.new, container)).subscribe();
            } catch (err) { container.innerHTML = '<div style="color:red; font-size:24px; text-align:center;">Виджет не найден</div>'; }
        }

        function copyObsUrl() {
            if(!currentWidget) return;
            const url = new URL(window.location.href);
            url.searchParams.set('widgetId', currentWidget.id);
            const temp = document.createElement("input"); temp.value = url.toString();
            document.body.appendChild(temp); temp.select(); document.execCommand("copy"); document.body.removeChild(temp);
            
            const h = document.getElementById('preview-container')?.style.height.replace('px','') || 600;
            document.getElementById('msg-title').textContent = "Скопировано!";
            document.getElementById('msg-text').textContent = `Вставьте ссылку в OBS (Browser Source). Рекомендуемая Ширина: 800, Высота: ${h}`;
            document.getElementById('msg-modal').classList.add('active');
        }
        
        // Перехват ресайза окна для правильного отображения превью
        window.addEventListener('resize', () => { if(!new URLSearchParams(window.location.search).get('widgetId')) resizePreview(); });
    </script>
</body>
</html>
