<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IMWIGET</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            margin: 0;
            padding: 0;
            overflow-x: hidden;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #1e293b; }
        ::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #64748b; }

        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        input[type="text"], input[type="number"], select, input[type="password"], input[type="email"] {
            background-color: #334155;
            border: 1px solid #475569;
            color: white;
            border-radius: 0.375rem;
            padding: 0.5rem 0.75rem;
            width: 100%;
            outline: none;
            transition: border-color 0.2s;
        }
        input[type="text"]:focus, input[type="number"]:focus, select:focus {
            border-color: #3b82f6;
        }

        #obs-view {
            width: 100vw;
            height: 100vh;
            background: transparent;
            overflow: hidden;
            display: none;
            position: absolute;
            top: 0; left: 0;
        }

        .marquee-wrapper {
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center; /* Center rows vertically */
        }

        .marquee-track-container {
            width: 100%;
            white-space: nowrap;
            overflow: hidden;
            box-sizing: border-box;
            display: flex;
            align-items: center;
        }
        
        /* Using two content blocks for seamless looping */
        .marquee-content {
            display: inline-flex;
            align-items: center;
            will-change: transform;
            padding-right: 50px; /* Gap between repeats */
        }

        @keyframes marquee-left {
            0% { transform: translateX(0); }
            100% { transform: translateX(-100%); }
        }
        @keyframes marquee-right {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }

        .effect-glow { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
        .effect-shadow { text-shadow: 4px 4px 8px rgba(0,0,0,0.8); }
        .effect-outline { -webkit-text-stroke: var(--outline-width, 1px) var(--outline-color, #000); }
        .effect-glow-outline { 
            -webkit-text-stroke: var(--outline-width, 1px) var(--outline-color, #000);
            text-shadow: 0 0 15px currentColor; 
        }

        .slideshow-container {
            width: 100%;
            height: 100%;
            position: relative;
            overflow: hidden;
        }
        .slideshow-slide {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background-repeat: no-repeat;
            background-position: center;
            opacity: 0;
            z-index: 0;
        }

        /* Transition Classes */
        /* Fade */
        .trans-fade { transition: opacity 1s ease-in-out; }
        .trans-fade.active { opacity: 1; z-index: 1; }
        
        /* Slide Left/Right */
        .trans-slide-left { transform: translateX(100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-left.active { opacity: 1; transform: translateX(0); z-index: 1; }
        .trans-slide-right { transform: translateX(-100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-right.active { opacity: 1; transform: translateX(0); z-index: 1; }
        
        /* Slide Up/Down */
        .trans-slide-up { transform: translateY(100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-up.active { opacity: 1; transform: translateY(0); z-index: 1; }
        .trans-slide-down { transform: translateY(-100%); transition: all 1s cubic-bezier(0.4, 0, 0.2, 1); }
        .trans-slide-down.active { opacity: 1; transform: translateY(0); z-index: 1; }

        /* Zoom */
        .trans-zoom-in { transform: scale(0.5); opacity: 0; transition: all 1.2s ease; }
        .trans-zoom-in.active { opacity: 1; transform: scale(1); z-index: 1; }
        .trans-zoom-out { transform: scale(1.5); opacity: 0; transition: all 1.2s ease; }
        .trans-zoom-out.active { opacity: 1; transform: scale(1); z-index: 1; }

        /* Flip */
        .trans-flip { transform: rotateY(90deg); opacity: 0; transition: all 0.8s ease-in; perspective: 1000px; }
        .trans-flip.active { opacity: 1; transform: rotateY(0deg); z-index: 1; transition-timing-function: ease-out;}

        .modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.8);
            z-index: 50;
            align-items: center;
            justify-content: center;
        }
        .modal.active { display: flex; }

        body.is-obs-mode {
            background-color: transparent !important;
        }

        .checkerboard-bg {
            background-image: 
                linear-gradient(45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(-45deg, #1e293b 25%, transparent 25%), 
                linear-gradient(45deg, transparent 75%, #1e293b 75%), 
                linear-gradient(-45deg, transparent 75%, #1e293b 75%);
            background-size: 20px 20px;
            background-position: 0 0, 0 10px, 10px -10px, -10px 0px;
        }
    </style>
</head>
<body>

    <div id="obs-view">
        <div id="widget-renderer" class="w-full h-full"></div>
    </div>

    <div id="app-container" class="min-h-screen flex flex-col hidden">
        <nav class="glass-panel p-4 sticky top-0 z-10">
            <div class="max-w-7xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <i class="fas fa-layer-group text-blue-500 text-2xl"></i>
                    <h1 class="text-xl font-bold">IMWIGET</h1>
                </div>
                <div class="flex items-center gap-4">
                    <span id="user-display" class="text-sm text-slate-300"></span>
                    <button id="btn-logout" class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded text-sm transition hidden">
                        <i class="fas fa-sign-out-alt mr-2"></i>Выйти
                    </button>
                </div>
            </div>
        </nav>

        <main class="flex-grow p-4 md:p-8 max-w-7xl mx-auto w-full flex flex-col md:flex-row gap-6">
            
            <div class="w-full md:w-1/3 flex flex-col gap-4">
                <div class="glass-panel p-4 rounded-xl flex justify-between items-center">
                    <h2 class="text-lg font-semibold">Виджеты</h2>
                    <button onclick="showCreateModal()" class="bg-blue-600 hover:bg-blue-500 text-white p-2 rounded-lg transition shadow-lg shadow-blue-500/30">
                        <i class="fas fa-plus"></i>
                    </button>
                </div>
                
                <div id="widgets-list" class="flex flex-col gap-3 overflow-y-auto" style="max-height: calc(100vh - 200px);">
                    <div class="text-center text-slate-500 py-8">Загрузка...</div>
                </div>
            </div>

            <!-- Editor Panel -->
            <div class="w-full md:w-2/3 glass-panel rounded-xl p-6 hidden flex-col" id="editor-panel">
                <div class="flex justify-between items-start mb-6 border-b border-slate-700 pb-4">
                    <div>
                        <h2 id="editor-title" class="text-2xl font-bold text-white">Редактор</h2>
                        <p class="text-slate-400 text-sm mt-1">Настрой виджет</p>
                    </div>
                    <div class="flex gap-2">
                         <button onclick="copyObsUrl()" class="bg-green-600 hover:bg-green-500 px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <i class="fas fa-link"></i> Ссылка
                        </button>
                        <button onclick="saveWidget()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2 rounded shadow transition flex items-center gap-2">
                            <i class="fas fa-save"></i> Сохранить
                        </button>
                    </div>
                </div>

                <div class="mb-6">
                    <h3 class="text-sm font-semibold text-slate-400 mb-2 uppercase tracking-wider">Предпросмотр</h3>
                    <div class="bg-slate-900 border border-slate-700 rounded-lg h-64 relative overflow-hidden flex items-center justify-center checkerboard-bg">
                        <div id="preview-container" class="w-full h-full relative"></div>
                    </div>
                </div>

                <!-- Dynamic Form injected here -->
                <div id="settings-form" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>

                <div class="mt-auto pt-8 flex justify-end">
                    <button onclick="deleteCurrentWidget()" class="text-red-400 hover:text-red-300 text-sm transition">
                        <i class="fas fa-trash-alt mr-1"></i> Удалить
                    </button>
                </div>
            </div>
            
            <div id="empty-state" class="w-full md:w-2/3 glass-panel rounded-xl p-8 flex flex-col items-center justify-center text-center">
                <i class="fas fa-magic text-6xl text-slate-600 mb-4"></i>
                <h3 class="text-xl font-bold text-white mb-2">Выбери или создай виджет</h3>
                <p class="text-slate-400 max-w-md">Я пукаю по утрам, но кому это интересно</p>
            </div>

        </main>
    </div>

    <div id="auth-modal" class="modal bg-slate-900">
        <div class="glass-panel p-8 rounded-2xl w-full max-w-md shadow-2xl">
            <div class="text-center mb-6">
                <i class="fas fa-video text-blue-500 text-4xl mb-3"></i>
                <h2 class="text-2xl font-bold">Вход</h2>
                <p class="text-slate-400 text-sm">Войди</p>
            </div>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Email</label>
                    <input type="email" id="auth-email" placeholder="your@email.com">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Пароль</label>
                    <input type="password" id="auth-password" placeholder="••••••••">
                </div>
                <div id="auth-error" class="text-red-400 text-sm hidden text-center"></div>
                
                <button onclick="handleLogin()" class="w-full bg-blue-600 hover:bg-blue-500 py-3 rounded-lg font-semibold transition mt-4">
                    Войти
                </button>
                <button onclick="handleSignup()" class="w-full bg-transparent border border-blue-600 text-blue-400 hover:bg-blue-600/10 py-3 rounded-lg font-semibold transition mt-2">
                    Регистрация
                </button>
            </div>
        </div>
    </div>

    <div id="create-modal" class="modal">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm">
            <h2 class="text-xl font-bold mb-4">Новый виджет</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Название</label>
                    <input type="text" id="new-widget-name" placeholder="Например: Донаты" maxlength="30">
                </div>
                <div>
                    <label class="block text-sm text-slate-300 mb-1">Тип виджета</label>
                    <select id="new-widget-type">
                        <option value="marquee">Бегущая строка (Текст)</option>
                        <option value="image-marquee">Бегущая строка (Изображения)</option>
                        <option value="slideshow">Слайдшоу (Одна зона)</option>
                        <option value="multi-slideshow">Многострочное Слайдшоу</option>
                    </select>
                </div>
                <div class="flex gap-2 mt-6">
                    <button onclick="closeModal('create-modal')" class="flex-1 bg-slate-700 hover:bg-slate-600 py-2 rounded transition">Отмена</button>
                    <button onclick="createWidget()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2 rounded transition font-semibold">Создать</button>
                </div>
            </div>
        </div>
    </div>

    <div id="msg-modal" class="modal z-[100]">
        <div class="glass-panel p-6 rounded-xl w-full max-w-sm text-center">
            <i id="msg-icon" class="fas fa-info-circle text-3xl mb-3 text-blue-500"></i>
            <h3 id="msg-title" class="text-lg font-bold mb-2">Message</h3>
            <p id="msg-text" class="text-slate-300 mb-6 text-sm"></p>
            <button onclick="closeModal('msg-modal')" class="bg-blue-600 hover:bg-blue-500 py-2 px-6 rounded transition">OK</button>
        </div>
    </div>

    <script>
        var SUPABASE_URL = 'https://lqjagftaeejdufwwvjwd.supabase.co';
        var SUPABASE_KEY = 'sb_publishable_6-9IBhMX9CMVbIackZAJ9g_UUk5FDqx';
        var supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

        var currentUser = null;
        var widgets = [];
        var currentWidget = null;
        var previewInterval = null;
        var previewIntervals = []; // Для хранения интервалов мульти-слайдшоу
        var debounceTimer = null;
        var loadedFonts = new Set();

        const GOOGLE_FONTS = [
            "Inter", "Roboto", "Open Sans", "Montserrat", "Lato", "Poppins", "Oswald", 
            "Source Sans Pro", "Raleway", "PT Sans", "Merriweather", "Nunito", "Concert One", 
            "Bebas Neue", "Lobster", "Pacifico", "Caveat", "Amatic SC", "Permanent Marker", 
            "Righteous", "Alfa Slab One", "Russo One", "Jost", "Playfair Display", "Cinzel", 
            "Anton", "Bungee", "Dancing Script", "Exo 2", "Teko"
        ];

        var DEFAULT_CONFIGS = {
            marquee: {
                text: 'Добро пожаловать на стрим! Спасибо за просмотр.',
                speed: 15,
                color: '#ffffff',
                fontFamily: 'Inter',
                fontSize: 64,
                effect: 'none',
                outlineColor: '#000000',
                outlineWidth: 2
            },
            'image-marquee': {
                gap: 20,
                imageHeight: 120,
                rows: [
                    { id: Date.now().toString(), speed: 15, direction: 'left', images: [] }
                ]
            },
            slideshow: {
                delay: 5,
                transition: 'fade',
                objectFit: 'contain',
                images: []
            },
            'multi-slideshow': {
                delay: 5,
                transition: 'fade',
                objectFit: 'contain',
                rowHeight: 200,
                gap: 20,
                rows: [
                    { id: Date.now().toString(), images: [] }
                ]
            }
        };

        document.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const obsWidgetId = urlParams.get('widgetId');

            if (obsWidgetId) {
                document.body.classList.add('is-obs-mode');
                document.getElementById('obs-view').style.display = 'block';
                document.getElementById('app-container').style.display = 'none';
                loadWidgetForOBS(obsWidgetId);
            } else {
                document.getElementById('obs-view').style.display = 'none';
                document.getElementById('app-container').classList.remove('hidden');
                checkAuth();
            }
        });

        async function checkAuth() {
            const { data: { session } } = await supabase.auth.getSession();
            handleAuthChange(session);
            supabase.auth.onAuthStateChange((_event, session) => handleAuthChange(session));
        }

        function handleAuthChange(session) {
            if (session) {
                currentUser = session.user;
                document.getElementById('auth-modal').classList.remove('active');
                document.getElementById('user-display').textContent = currentUser.email;
                document.getElementById('btn-logout').classList.remove('hidden');
                loadWidgets();
            } else {
                currentUser = null;
                document.getElementById('auth-modal').classList.add('active');
                document.getElementById('btn-logout').classList.add('hidden');
            }
        }

        async function handleLogin() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return showError("Введите email и пароль");
            const { error } = await supabase.auth.signInWithPassword({ email, password });
            if (error) showError(error.message);
        }

        async function handleSignup() {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-password').value;
            if(!email || !password) return showError("Введите email и пароль");
            const { error } = await supabase.auth.signUp({ email, password });
            if (error) showError(error.message);
            else showMessage("Успех", "Регистрация успешна. Проверьте почту или войдите.");
        }

        function showError(msg) {
            const errDiv = document.getElementById('auth-error');
            errDiv.textContent = msg;
            errDiv.classList.remove('hidden');
        }

        async function loadWidgets() {
            const listEl = document.getElementById('widgets-list');
            listEl.innerHTML = '<div class="text-center text-slate-500 py-4">Загрузка...</div>';
            const { data, error } = await supabase.from('p_widgets').select('*').order('created_at', { ascending: false });
            if (error) return listEl.innerHTML = '<div class="text-red-400 text-sm p-4">Ошибка загрузки</div>';
            widgets = data || [];
            renderWidgetList();
        }

        function renderWidgetList() {
            const listEl = document.getElementById('widgets-list');
            listEl.innerHTML = '';
            if (widgets.length === 0) return listEl.innerHTML = '<div class="text-center text-slate-500 py-8 text-sm">Нет виджетов</div>';
            
            widgets.forEach(w => {
                const div = document.createElement('div');
                div.className = `p-3 rounded-lg border cursor-pointer transition flex items-center gap-3 ${
                    currentWidget?.id === w.id ? 'bg-blue-600/20 border-blue-500' : 'bg-slate-800 border-slate-700 hover:bg-slate-700'
                }`;
                div.onclick = () => selectWidget(w);
                
                let icon = 'fa-font', typeText = 'Текст';
                if(w.widget_type === 'slideshow') { icon = 'fa-images'; typeText = 'Слайдшоу'; }
                if(w.widget_type === 'image-marquee') { icon = 'fa-film'; typeText = 'Строка картинок'; }
                if(w.widget_type === 'multi-slideshow') { icon = 'fa-th-list'; typeText = 'Многострочное Слайдшоу'; }

                div.innerHTML = `
                    <div class="bg-slate-900 w-10 h-10 rounded flex items-center justify-center text-blue-400"><i class="fas ${icon}"></i></div>
                    <div><div class="font-semibold text-white">${w.name}</div><div class="text-xs text-slate-400">${typeText}</div></div>
                `;
                listEl.appendChild(div);
            });
        }

        function showCreateModal() {
            document.getElementById('new-widget-name').value = '';
            document.getElementById('create-modal').classList.add('active');
        }

        async function createWidget() {
            const name = document.getElementById('new-widget-name').value.trim();
            const type = document.getElementById('new-widget-type').value;
            if (!name) return alertCustom("Ошибка", "Введите название виджета");

            // Deep copy default to avoid reference sharing
            const config = JSON.parse(JSON.stringify(DEFAULT_CONFIGS[type]));
            if(type === 'image-marquee' || type === 'multi-slideshow') config.rows[0].id = Date.now().toString();

            const { data, error } = await supabase.from('p_widgets').insert([{ user_id: currentUser.id, name, widget_type: type, config }]).select();
            if (error) return alertCustom("Ошибка", "Не удалось создать");
            
            closeModal('create-modal');
            await loadWidgets();
            if (data && data.length > 0) selectWidget(data[0]);
        }

        function selectWidget(widget) {
            currentWidget = widget;
            renderWidgetList();
            document.getElementById('empty-state').classList.add('hidden');
            document.getElementById('editor-panel').classList.remove('hidden');
            document.getElementById('editor-panel').classList.add('flex');
            document.getElementById('editor-title').textContent = widget.name;
            buildSettingsForm();
            updatePreview();
        }

        async function saveWidget() {
            if (!currentWidget) return;
            syncFormToConfig(); // Ensures latest DOM values are in config

            const { error } = await supabase.from('p_widgets').update({ 
                config: currentWidget.config, 
                updated_at: new Date().toISOString() 
            }).eq('id', currentWidget.id);

            if (error) return alertCustom("Ошибка", "Не удалось сохранить");
            
            const btn = document.querySelector('button[onclick="saveWidget()"]');
            const origHtml = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-check"></i> Сохранено';
            btn.classList.replace('bg-blue-600', 'bg-green-600');
            setTimeout(() => { btn.innerHTML = origHtml; btn.classList.replace('bg-green-600', 'bg-blue-600'); }, 2000);
        }

        async function deleteCurrentWidget() {
            if (!currentWidget) return;
            const btn = document.querySelector('button[onclick="deleteCurrentWidget()"]');
            if (btn.textContent.includes('Вы уверены?')) {
                const { error } = await supabase.from('p_widgets').delete().eq('id', currentWidget.id);
                if (!error) {
                    currentWidget = null;
                    document.getElementById('editor-panel').classList.add('hidden');
                    document.getElementById('editor-panel').classList.remove('flex');
                    document.getElementById('empty-state').classList.remove('hidden');
                    await loadWidgets();
                }
                btn.innerHTML = '<i class="fas fa-trash-alt mr-1"></i> Удалить виджет';
            } else {
                btn.innerHTML = '<i class="fas fa-exclamation-triangle mr-1"></i> Вы уверены? Нажмите еще раз';
                setTimeout(() => { if(currentWidget) btn.innerHTML = '<i class="fas fa-trash-alt mr-1"></i> Удалить виджет'; }, 3000);
            }
        }

        function buildSettingsForm() {
            const form = document.getElementById('settings-form');
            form.innerHTML = '';
            const c = currentWidget.config;

            if (currentWidget.widget_type === 'marquee') {
                const fontsOptions = GOOGLE_FONTS.map(f => `<option value="${f}" ${c.fontFamily===f?'selected':''}>${f}</option>`).join('');
                form.innerHTML = `
                    <div class="col-span-1 md:col-span-2">
                        <label class="block text-sm text-slate-300 mb-1">Текст</label>
                        <input type="text" id="setting-text" value="${escapeHtml(c.text || '')}" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Шрифт</label>
                        <select id="setting-font" onchange="debouncePreview()">
                            <option value="Inter" ${!c.fontFamily||c.fontFamily==='Inter'?'selected':''}>Inter (По умолчанию)</option>
                            ${fontsOptions}
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Скорость (сек. на оборот)</label>
                        <input type="number" id="setting-speed" value="${c.speed || 15}" min="1" max="100" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Размер шрифта (px)</label>
                        <input type="number" id="setting-size" value="${c.fontSize || 64}" min="12" max="300" oninput="debouncePreview()">
                    </div>
                    <div>
                        <label class="block text-sm text-slate-300 mb-1">Цвет текста</label>
                        <div class="flex gap-2">

        function renderRowsEditor() {
            const container = document.getElementById('rows-container');
            if(!container) return;
            container.innerHTML = '';
            
            const rows = currentWidget.config.rows || [];
            const isMarquee = currentWidget.widget_type === 'image-marquee';

            rows.forEach((row, index) => {
                const rowEl = document.createElement('div');
                rowEl.className = 'bg-slate-800 border border-slate-600 rounded-lg p-4';
                
                let controlsHtml = '';
                if(isMarquee) {
                    controlsHtml = `
                    <div class="flex gap-4 mb-4">
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400 mb-1">Скорость (сек)</label>
                            <input type="number" value="${row.speed}" min="1" max="200" class="row-speed text-sm" data-idx="${index}" oninput="updateRowConfig(this)">
                        </div>
                        <div class="flex-1">
                            <label class="block text-xs text-slate-400 mb-1">Направление</label>
                            <select class="row-dir text-sm" data-idx="${index}" onchange="updateRowConfig(this)">
                                <option value="left" ${row.direction==='left'?'selected':''}>Влево</option>
                                <option value="right" ${row.direction==='right'?'selected':''}>Вправо</option>
                            </select>
                        </div>
                    </div>`;
                }

                rowEl.innerHTML = `
                    <div class="flex justify-between items-center mb-3">
                        <h4 class="font-bold text-slate-300"><i class="fas fa-bars text-slate-500 mr-2"></i>Строка ${index + 1}</h4>
                        <button onclick="removeRow(${index})" class="text-red-400 hover:text-red-300 text-sm"><i class="fas fa-times"></i></button>
                    </div>
                    ${controlsHtml}
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="block text-xs font-semibold text-slate-400">Изображения в строке</label>
                            <label class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded cursor-pointer text-xs transition">
                                <i class="fas fa-upload"></i> Загрузить
                                <input type="file" accept="image/*" class="hidden" onchange="handleImageUpload(event, ${index})">
                            </label>
                        </div>
                        <div id="row-imgs-${index}" class="flex gap-2 overflow-x-auto pb-2 custom-scroll"></div>
                    </div>
                `;
                container.appendChild(rowEl);
                renderImageList(`row-imgs-${index}`, row.images || [], index);
            });
        }

        function addRow() {
            currentWidget.config.rows.push({
                id: Date.now().toString(), speed: 15, direction: 'left', images: []
            });
            renderRowsEditor();
            updatePreview();
            saveWidget();
        }

        function removeRow(idx) {
            currentWidget.config.rows.splice(idx, 1);
            renderRowsEditor();
            updatePreview();
            saveWidget();
        }

        function updateRowConfig(el) {
            const idx = el.getAttribute('data-idx');
            if(el.classList.contains('row-speed')) currentWidget.config.rows[idx].speed = parseInt(el.value) || 15;
            if(el.classList.contains('row-dir')) currentWidget.config.rows[idx].direction = el.value;
            debouncePreview();
        }

        function renderImageList(containerId, images, rowIndex) {
            const list = document.getElementById(containerId);
            if(!list) return;
            list.innerHTML = '';
            
            if(images.length === 0) {
                list.innerHTML = '<div class="w-full text-slate-500 text-xs text-center py-4 border border-dashed border-slate-700 rounded">Пусто</div>';
                return;
            }

            images.forEach((url, i) => {
                const div = document.createElement('div');
                div.className = 'relative flex-shrink-0 w-20 h-20 bg-slate-900 rounded group overflow-hidden border border-slate-700';
                div.innerHTML = `
                    <img src="${url}" class="w-full h-full object-cover">
                    <button onclick="removeImage(${i}, ${rowIndex})" class="absolute top-0 right-0 bg-red-500 hover:bg-red-600 text-white w-5 h-5 flex items-center justify-center opacity-0 group-hover:opacity-100 transition rounded-bl">
                        <i class="fas fa-times text-[10px]"></i>
                    </button>
                `;
                list.appendChild(div);
            });
        }

        async function handleImageUpload(event, rowIndex) {
            const file = event.target.files[0];
            if (!file) return;

            const label = event.target.parentElement;
            const originalHtml = label.innerHTML;
            label.innerHTML = '<i class="fas fa-spinner fa-spin"></i>';

            try {
                const fileExt = file.name.split('.').pop();
                const fileName = `${Math.random().toString(36).substring(2)}.${fileExt}`;
                const filePath = `${currentUser.id}/${fileName}`;

                const { error } = await supabase.storage.from('p_widget_assets').upload(filePath, file);
                if (error) throw error;

                const { data: publicData } = supabase.storage.from('p_widget_assets').getPublicUrl(filePath);

                if (rowIndex !== null) {
                    if (!currentWidget.config.rows[rowIndex].images) currentWidget.config.rows[rowIndex].images = [];
                    currentWidget.config.rows[rowIndex].images.push(publicData.publicUrl);
                    renderImageList(`row-imgs-${rowIndex}`, currentWidget.config.rows[rowIndex].images, rowIndex);
                } else {
                    if (!currentWidget.config.images) currentWidget.config.images = [];
                    currentWidget.config.images.push(publicData.publicUrl);
                    renderImageList('image-list-global', currentWidget.config.images, null);
                }
                
                updatePreview();
                saveWidget();
            } catch (err) {
                console.error(err);
                alertCustom("Ошибка", "Сбой загрузки");
            } finally {
                label.innerHTML = originalHtml;
                event.target.value = '';
            }
        }

        function removeImage(imgIndex, rowIndex) {
            if (rowIndex !== null) {
                currentWidget.config.rows[rowIndex].images.splice(imgIndex, 1);
                renderImageList(`row-imgs-${rowIndex}`, currentWidget.config.rows[rowIndex].images, rowIndex);
            } else {
                currentWidget.config.images.splice(imgIndex, 1);
                renderImageList('image-list-global', currentWidget.config.images, null);
            }
            updatePreview();
            saveWidget();
        }

        function syncFormToConfig() {
            if (!currentWidget) return;
            const c = currentWidget.config;
            if (currentWidget.widget_type === 'marquee') {
                c.text = document.getElementById('setting-text').value;
                c.fontFamily = document.getElementById('setting-font').value;
                c.speed = parseInt(document.getElementById('setting-speed').value) || 15;
                c.color = document.getElementById('setting-color').value;
                c.fontSize = parseInt(document.getElementById('setting-size').value) || 64;
                c.effect = document.getElementById('setting-effect').value;
                c.outlineColor = document.getElementById('setting-outline-color').value;
                c.outlineWidth = parseInt(document.getElementById('setting-outline-width').value) || 2;
            } else if (currentWidget.widget_type === 'slideshow') {
                c.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                c.transition = document.getElementById('setting-transition').value;
                c.objectFit = document.getElementById('setting-fit').value;
            } else if (currentWidget.widget_type === 'image-marquee') {
                c.imageHeight = parseInt(document.getElementById('setting-img-height').value) || 120;
                c.gap = parseInt(document.getElementById('setting-gap').value) || 20;
            } else if (currentWidget.widget_type === 'multi-slideshow') {
                c.delay = parseInt(document.getElementById('setting-delay').value) || 5;
                c.transition = document.getElementById('setting-transition').value;
                c.objectFit = document.getElementById('setting-fit').value;
                c.rowHeight = parseInt(document.getElementById('setting-row-height').value) || 200;
                c.gap = parseInt(document.getElementById('setting-gap').value) || 20;
            }
        }

        function debouncePreview() {
            clearTimeout(debounceTimer);
            debounceTimer = setTimeout(() => {
                syncFormToConfig();
                updatePreview();
            }, 300);
        }

        function loadFont(fontName) {
            if (!fontName || loadedFonts.has(fontName) || fontName === 'Inter') return;
            const id = 'font-' + fontName.replace(/\s+/g, '-');
            if (!document.getElementById(id)) {
                const link = document.createElement('link');
                link.id = id; link.rel = 'stylesheet';
                link.href = `https://fonts.googleapis.com/css2?family=${fontName.replace(/\s+/g, '+')}:wght@400;700;900&display=swap`;
                document.head.appendChild(link);
                loadedFonts.add(fontName);
            }
        }

        function updatePreview() {
            const container = document.getElementById('preview-container');
            if(!container) return;
            renderWidget(currentWidget, container);
        }

        function renderWidget(widget, container) {
            container.innerHTML = '';
            if (previewInterval) { clearInterval(previewInterval); previewInterval = null; }
            if (previewIntervals) { previewIntervals.forEach(clearInterval); previewIntervals = []; }
            
            const c = widget.config;

            if (widget.widget_type === 'marquee') {
                loadFont(c.fontFamily);
                
                const wrapper = document.createElement('div');
                wrapper.className = 'marquee-wrapper';
                
                const track = document.createElement('div');
                track.className = 'marquee-track-container';
                
                // Duplicate content for seamless loop
                const buildContent = () => {
                    const span = document.createElement('div');
                    span.className = 'marquee-content font-bold';
                    span.textContent = c.text || 'Текст';
                    span.style.color = c.color || '#fff';
                    span.style.fontSize = `${c.fontSize || 64}px`;
                    span.style.fontFamily = `"${c.fontFamily || 'Inter'}", sans-serif`;
                    span.style.animation = `marquee-left ${c.speed || 15}s linear infinite`;
                    
                    if(c.effect && c.effect !== 'none') span.classList.add(`effect-${c.effect}`);
                    span.style.setProperty('--outline-color', c.outlineColor || '#000');
                    span.style.setProperty('--outline-width', `${c.outlineWidth || 2}px`);
                    return span;
                };

                track.appendChild(buildContent());
                track.appendChild(buildContent()); // Second copy for continuous flow
                wrapper.appendChild(track);
                container.appendChild(wrapper);

            } 
            else if (widget.widget_type === 'image-marquee') {
                const wrapper = document.createElement('div');
                wrapper.className = 'marquee-wrapper';
                wrapper.style.gap = `${c.gap || 20}px`;

                (c.rows || []).forEach(row => {
                    if(!row.images || row.images.length === 0) return;
                    
                    const track = document.createElement('div');
                    track.className = 'marquee-track-container';
                    
                    const buildImages = () => {
                        const content = document.createElement('div');
                        content.className = 'marquee-content flex gap-4 items-center';
                        content.style.animation = `marquee-${row.direction || 'left'} ${row.speed || 15}s linear infinite`;
                        
                        row.images.forEach(url => {
                            const img = document.createElement('img');
                            img.src = url;
                            img.style.height = `${c.imageHeight || 120}px`;
                            img.className = "rounded shadow-lg object-contain";
                            content.appendChild(img);
                        });
                        return content;
                    };

                    track.appendChild(buildImages());
                    track.appendChild(buildImages());
                    wrapper.appendChild(track);
                });
                
                if(wrapper.children.length === 0) wrapper.innerHTML = '<div class="text-slate-500 m-auto">Добавьте изображения в строки</div>';
                container.appendChild(wrapper);
            }
            else if (widget.widget_type === 'slideshow') {
                const images = c.images || [];
                if (images.length === 0) {
                    container.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 font-bold">Нет изображений</div>';
                    return;
                }

                const wrap = document.createElement('div');
                wrap.className = 'slideshow-container';
                
                const slideElements = [];
                images.forEach((url, i) => {
                    const slide = document.createElement('div');
                    const transClass = c.transition || 'fade';
                    slide.className = `slideshow-slide trans-${transClass} ${i === 0 ? 'active' : ''}`;
                    slide.style.backgroundImage = `url('${url}')`;
                    slide.style.backgroundSize = c.objectFit || 'contain';
                    wrap.appendChild(slide);
                    slideElements.push(slide);
                });

                container.appendChild(wrap);

                if (images.length > 1) {
                    let currentIndex = 0;
                    const delayMs = (c.delay || 5) * 1000;
                    previewInterval = setInterval(() => {
                        slideElements[currentIndex].classList.remove('active');
                        currentIndex = (currentIndex + 1) % images.length;
                        slideElements[currentIndex].classList.add('active');
                    }, delayMs);
                }
            }
            else if (widget.widget_type === 'multi-slideshow') {
                const wrapper = document.createElement('div');
                wrapper.className = 'w-full h-full flex flex-col justify-center';
                wrapper.style.gap = `${c.gap || 20}px`;

                (c.rows || []).forEach(row => {
                    const rowContainer = document.createElement('div');
                    rowContainer.style.height = `${c.rowHeight || 200}px`;
                    rowContainer.style.width = '100%';
                    rowContainer.style.position = 'relative';
                    rowContainer.style.overflow = 'hidden';

                    const images = row.images || [];
                    if (images.length === 0) {
                        rowContainer.innerHTML = '<div class="flex items-center justify-center w-full h-full text-slate-500 bg-slate-800/50 border border-dashed border-slate-700">Нет изображений</div>';
                        wrapper.appendChild(rowContainer);
                        return;
                    }

                    const slideElements = [];
                    images.forEach((url, i) => {
                        const slide = document.createElement('div');
                        const transClass = c.transition || 'fade';
                        slide.className = `slideshow-slide trans-${transClass} ${i === 0 ? 'active' : ''}`;
                        slide.style.backgroundImage = `url('${url}')`;
                        slide.style.backgroundSize = c.objectFit || 'contain';
                        rowContainer.appendChild(slide);
                        slideElements.push(slide);
                    });

                    wrapper.appendChild(rowContainer);

                    if (images.length > 1) {
                        let currentIndex = 0;
                        const delayMs = (c.delay || 5) * 1000;
                        const interval = setInterval(() => {
                            slideElements[currentIndex].classList.remove('active');
                            currentIndex = (currentIndex + 1) % images.length;
                            slideElements[currentIndex].classList.add('active');
                        }, delayMs);
                        previewIntervals.push(interval);
                    }
                });
                
                if(wrapper.children.length === 0) wrapper.innerHTML = '<div class="text-slate-500 m-auto">Добавьте строки с изображениями</div>';
                container.appendChild(wrapper);
            }
        }

        async function loadWidgetForOBS(id) {
            const container = document.getElementById('widget-renderer');
            container.innerHTML = '<div style="color:white; text-align:center; padding:20px;">Загрузка виджета...</div>';

            try {
                const { data, error } = await supabase.from('p_widgets').select('*').eq('id', id).single();
                if (error || !data) throw error;
                
                renderWidget(data, container);

                supabase.channel(`public:p_widgets:id=eq.${id}`)
                    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'p_widgets', filter: `id=eq.${id}` }, payload => {
                        renderWidget(payload.new, container);
                    }).subscribe();

            } catch (err) {
                container.innerHTML = '<div style="color:red; font-size:24px; text-shadow: 2px 2px 0 #000; padding:20px;">Ошибка: Виджет не найден</div>';
            }
        }

        function copyObsUrl() {
            if(!currentWidget) return;
            const url = new URL(window.location.href);
            url.searchParams.set('widgetId', currentWidget.id);
            
            const tempInput = document.createElement("input");
            tempInput.value = url.toString();
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);

            showMessage("Скопировано!", "Ссылка скопирована в буфер обмена. Вставьте её в OBS как источник 'Браузер' (Browser Source).");
        }

        function closeModal(id) { document.getElementById(id).classList.remove('active'); }
        
        function showMessage(title, text) {
            document.getElementById('msg-title').textContent = title;
            document.getElementById('msg-text').textContent = text;
            const icon = document.getElementById('msg-icon');
            icon.className = title.includes('Ошибка') ? 'fas fa-exclamation-triangle text-3xl mb-3 text-red-500' :
                             title.includes('Успех') || title.includes('Скопировано') ? 'fas fa-check-circle text-3xl mb-3 text-green-500' :
                             'fas fa-info-circle text-3xl mb-3 text-blue-500';
            document.getElementById('msg-modal').classList.add('active');
        }

        function alertCustom(title, msg) { showMessage(title, msg); }
        function escapeHtml(unsafe) {
            return (unsafe||'').toString().replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }
    </script>
</body>
</html>
